/* ============================== LECTURE 3 · INTERNET FUNDAMENTALS ============================== */
{h:"Lecture 3",c:"Lecture cover",t:"12:00–12:50",html:`
<div class="cover">
  <div class="eyebrow">Class 2 · Lecture 3 · C2-L1</div>
  <h1>Internet<br>Fundamentals</h1>
  <div class="meta">
    <b>Covers</b>How the web works · the browser · web addresses · search · websites · Safari on a Mac<br>
    <b>Timing</b>Teach 30 min · Hands-on lab 15 min · Checkpoint 5 min · Break 10 min<br>

{h:"Lecture 3",c:"Objectives",t:"1 min",html:`
<h2><span class="n">Why this matters</span>Find what you need — and land on the real site</h2>
<p class="lead">Most people search for a site they visit every week, click the first result, and hope. There is a faster, safer way.</p>
<div class="obj"><span class="tag">By the end of this lecture you can</span>
<ul>
<li>Explain the difference between a browser and a search engine</li>
<li>Name the parts of the browser and use tabs, Back, and Refresh</li>
<li>Read a web address and tell who you are really visiting</li>
<li>Search smarter and spot the ads in search results</li>
<li>Find your way around a website and save it to your favorites</li>
<li>Do the same things on a Mac, in Safari</li>
</ul></div>`,
n:"The address-bar-versus-search confusion is the biggest practical win this hour. Flag it now."},

{h:"Lecture 3",c:"Concept",t:"1 min",html:`
<h2><span class="n">Two tools, two jobs</span>Browser vs. search engine</h2>
<div class="grid g2">
<div class="card"><span class="tag">A program on your computer</span><h3>Web browser</h3><p>Opens and shows web pages. You need one to use the internet at all.</p><p class="mt"><b>Microsoft Edge</b> (built into Windows) · <b>Apple Safari</b> (built into every Mac) · Google Chrome · Mozilla Firefox</p></div>
<div class="card"><span class="tag">A website you open in the browser</span><h3>Search engine</h3><p>Looks things up and gives you a list of pages to choose from.</p><p class="mt"><b>Google</b> · Bing · DuckDuckGo · Yahoo</p></div>
</div>
<div class="callout"><span class="tag">In one line</span><p>The browser is the <b>car</b>. The search engine is the <b>map</b> you look at when you don't know the address.</p></div>`,
n:"Do not run a browser-preference debate. Today we use Edge because it is already on every laptop."},

{h:"Lecture 3",c:"Concept",t:"2 min",html:`
<h2><span class="n">The most important habit</span>Address bar or search?</h2>
<div class="grid g2">
<div class="card good"><span class="tag">You know where you're going</span><h3>Type the address</h3><p>Type <span class="url">ssa.gov</span> and press <span class="kbd">Enter</span>. You arrive at Social Security — no results page, no ads, nobody in between.</p></div>
<div class="card"><span class="tag">You're looking for something</span><h3>Type a search</h3><p>Type <b>how to replace my social security card</b>. You get a list of possibilities to choose from.</p></div>
</div>
<div class="callout caution"><span class="tag">Why it matters</span><p>Searching for a site you already know is how people land on look-alike sites and paid ads. If you know the address, type it.</p></div>
<p class="mt small">You don't need to type <b>www.</b> or <b>https://</b> — the browser fills them in.</p>`,
n:"The single most valuable slide of the hour. Type ssa.gov live. Then search 'social security' and show the Sponsored results sitting above the real one."},

{h:"Lecture 3",c:"Concept",t:"1 min",html:`
<h2><span class="n">Links and tabs</span>Explore without losing your place</h2>
<div class="grid g2">
<div class="card"><h3>Spot a link</h3><p>When the pointer turns into a <b>pointing hand</b>, it's a link. Links can be words (often blue and underlined), pictures, or buttons.</p></div>
<div class="card"><h3>Went the wrong way?</h3><p>Click <b>Back</b> (←) or press <span class="kbd">Alt</span>+<span class="kbd">←</span>. Nothing is lost.</p></div>
</div>
<table class="mt">
<tr><th>Press</th><th>To</th></tr>
<tr><td><span class="kbd">Ctrl</span>+<span class="kbd">T</span></td><td>Open a new tab</td></tr>
<tr><td><span class="kbd">Ctrl</span> + click a link</td><td>Open the link in a new tab — your current page stays put</td></tr>
<tr><td><span class="kbd">Ctrl</span>+<span class="kbd">W</span></td><td>Close this tab</td></tr>
<tr><td><span class="kbd">Ctrl</span>+<span class="kbd">Shift</span>+<span class="kbd">T</span></td><td>Bring back a tab you closed by mistake</td></tr>
</table>`,
n:"Ctrl+Shift+T is the 'undo' of the browser. It gets the same reaction as Ctrl+Z did in Lecture 1."},

{h:"Lecture 3",c:"On a Mac",t:"2 min",html:`
<h2><span class="n">On a Mac</span>Press ⌘ Command wherever Windows says Ctrl</h2>
<table>
<tr><th>To</th><th>Windows</th><th>Mac</th></tr>
<tr><td>Jump to the address bar</td><td><span class="kbd">Ctrl</span> + <span class="kbd">L</span></td><td><span class="kbd">⌘</span> + <span class="kbd">L</span></td></tr>
<tr><td>Open a new tab</td><td><span class="kbd">Ctrl</span> + <span class="kbd">T</span></td><td><span class="kbd">⌘</span> + <span class="kbd">T</span></td></tr>
<tr><td>Close this tab</td><td><span class="kbd">Ctrl</span> + <span class="kbd">W</span></td><td><span class="kbd">⌘</span> + <span class="kbd">W</span></td></tr>
<tr><td>Bring back a closed tab</td><td><span class="kbd">Ctrl</span> + <span class="kbd">Shift</span> + <span class="kbd">T</span></td><td><span class="kbd">⌘</span> + <span class="kbd">Shift</span> + <span class="kbd">T</span></td></tr>
<tr><td>Go back a page</td><td><span class="kbd">Alt</span> + <span class="kbd">←</span></td><td><span class="kbd">⌘</span> + <span class="kbd">[</span></td></tr>
<tr><td>Save to favorites</td><td><span class="kbd">Ctrl</span> + <span class="kbd">D</span></td><td><span class="kbd">⌘</span> + <span class="kbd">D</span></td></tr>
<tr><td>Find a word on the page</td><td><span class="kbd">Ctrl</span> + <span class="kbd">F</span></td><td><span class="kbd">⌘</span> + <span class="kbd">F</span></td></tr>
<tr><td>Zoom in · out · reset</td><td><span class="kbd">Ctrl</span> + <span class="kbd">+</span> <span class="kbd">−</span> <span class="kbd">0</span></td><td><span class="kbd">⌘</span> + <span class="kbd">+</span> <span class="kbd">−</span> <span class="kbd">0</span></td></tr>
</table>
<p class="hint">⌘ is the Command key, right beside the space bar. Hold it, then tap the letter — just like Ctrl.</p>`,
n:"Sixty-second rule, not a memory test. If nobody in the room uses a Mac, point at the table, say it's in the online slides, and move on."},

{h:"Lecture 3",c:"Concept",t:"2 min",html:`
<h2><span class="n">Search smarter</span>Four tricks that narrow the list</h2>
<table>
<tr><th>Type this</th><th>What it does</th><th>Example</th></tr>
<tr><td><span class="url">"exact phrase"</span></td><td>Only pages with those words in that order</td><td><span class="url">"Contra Costa job fair"</span></td></tr>
<tr><td><span class="url">-word</span></td><td>Leave out pages with that word</td><td><span class="url">jaguar -car</span> (the animal)</td></tr>
<tr><td><span class="url">OR</span></td><td>Either word — capital letters</td><td><span class="url">college OR university Pleasant Hill</span></td></tr>
<tr><td><span class="url">site:</span></td><td>Only one kind of site</td><td><span class="url">food assistance site:.gov</span></td></tr>
</table>
<div class="callout"><span class="tag">Tip</span><p>All the words you type are already included — you don't need to type AND. Not finding it? Use different words, or try the <b>related searches</b> at the bottom of the page.</p></div>`,
n:"Demo one live: search jaguar, then jaguar -car, and point at how the results change. site:.gov is the one that protects people — official answers only."},

{h:"Lecture 3",c:"Concept",t:"1 min",html:`
<h2><span class="n">Choosing a result</span>Five-second check before you click</h2>
<ol class="steps">
<li><b>Is it labeled Sponsored or Ad?</b> It paid to be at the top. Skip it unless you meant to shop.</li>
<li><b>Read the address.</b> Is the name the organization you expect? Is it <span class="url">.gov</span> for government services?</li>
<li><b>Does the title answer your question?</b> Pick the one that matches, not just the first.</li>
<li><b>After you click,</b> check for a <b>Not secure</b> warning and read the address again.</li>
</ol>
<div class="callout caution"><span class="tag">Caution</span><p>Government services like Social Security, Medicare, and the DMV are free on their official <span class="url">.gov</span> sites. Sites that charge a fee to “help” are usually unnecessary.</p></div>`,
n:"This is the bridge into Lecture 4. Keep it practical: read the address, every time."},

{h:"Lecture 3",c:"Concept",t:"2 min",html:`
<h2><span class="n">Favorites</span>Save a site so you never type it again</h2>
<div class="split">
<ol class="steps">
<li>Go to the site, for example <span class="url">ssa.gov</span>.</li>
<li>Click the <b>star ☆</b> at the right end of the address bar (or press <span class="kbd">Ctrl</span>+<span class="kbd">D</span>).</li>
<li>Choose the folder <b>Favorites bar</b> and click <b>Done</b>.</li>
<li>Don't see the bar? Press <span class="kbd">Ctrl</span>+<span class="kbd">Shift</span>+<span class="kbd">B</span> to show it.</li>
</ol>
<div class="card"><span class="tag">Same idea, different name</span><p><b>Edge</b> calls them <b>Favorites</b>. <b>Chrome</b> calls them <b>Bookmarks</b>. Same star, same shortcuts.</p></div>
</div>
<div class="callout"><span class="tag">Tip</span><p>Keep it tidy: right-click the favorites bar → <b>Add folder</b> → name it <b>My Sites</b>. Like folders in File Explorer.</p></div>`,
n:"Favorites are the safe habit: a saved real address beats searching every time and risking a look-alike."},

{h:"Lecture 3",c:"On a Mac",t:"2 min",html:`
<h2><span class="n">On a Mac</span>Favorites, Reader, and PDFs in Safari</h2>
<div class="grid g3">
<div class="card"><span class="tag">Save a favorite</span><h3><span class="kbd">⌘ Cmd</span>+<span class="kbd">D</span></h3><p>Choose <b>Favorites</b> in the list, then click <b>Add</b>. No bar? <b>View › Show Favorites Bar</b>.</p></div>
<div class="card"><span class="tag">Easier reading</span><h3>Reader</h3><p><b>View › Show Reader</b> clears away ads and clutter and shows large, clean text. Press <span class="kbd">Esc</span> to leave.</p></div>
<div class="card"><span class="tag">Keep a copy</span><h3>Save as PDF</h3><p><b>File › Export as PDF</b>. Same result as printing to PDF on Windows.</p></div>
</div>
<div class="callout"><span class="tag">Same habits</span><p>Type the address you know, skip Sponsored results, save the real site. Choose Safari's search engine in <b>Safari › Settings › Search</b>.</p></div>`,
n:"Reader is the Mac feature people love most — demo it on a cluttered news page if you have a Mac on hand. Favorites in Safari works like Edge: star equals Command-D."},
{h:"Lecture 3",c:"Concept",t:"1 min",html:`
<h2><span class="n">Make pages easier to use</span>Zoom, find, and print</h2>
<div class="grid g3">
<div class="card"><h3>Zoom</h3><p><span class="kbd">Ctrl</span>+<span class="kbd">+</span> bigger · <span class="kbd">Ctrl</span>+<span class="kbd">−</span> smaller · <span class="kbd">Ctrl</span>+<span class="kbd">0</span> back to normal</p></div>
<div class="card"><h3>Find on page</h3><p><span class="kbd">Ctrl</span>+<span class="kbd">F</span>, then type a word. The browser highlights every match.</p></div>
<div class="card"><h3>Print</h3><p><span class="kbd">Ctrl</span>+<span class="kbd">P</span>. Choose <b>Save as PDF</b> to keep a copy instead of printing.</p></div>
</div>
<div class="callout"><span class="tag">Tip</span><p>Text too small to read is the most common complaint — zoom fixes it on every website.</p></div>`,
n:"Have everyone zoom in and back to normal. Ctrl+F on a long benefits page saves minutes of scrolling."},

{h:"Lecture 3",c:"Demonstration",t:"3 min",html:`
<h2><span class="n">Watch first</span>Search, check, save</h2>
<ol class="steps">
<li>Open Edge, type <span class="url">ssa.gov</span>, press <span class="kbd">Enter</span>. Check: no <b>Not secure</b> warning.</li>
<li>Click the star → <b>Favorites bar</b> → <b>Done</b>.</li>
<li>New tab (<span class="kbd">Ctrl</span>+<span class="kbd">T</span>). Search: <b>public library near me</b>. Skip any Sponsored result.</li>
<li>Read the address of a real result, open it, and use the site's <b>navigation menu</b> to find computer help.</li>
<li>Save it to the favorites bar. Right-click the bar → <b>Add folder</b> → <b>My Sites</b>, and drag both favorites in.</li>
</ol>`,
n:"Narrate the address check out loud every time. That habit is the point of the hour."},

{h:"Lecture 3",c:"Hands-on lab",t:"15 min",html:`
<div class="lab">
<span class="badge">Lab 3 · 15 minutes</span>
<h2 style="margin-bottom:.4em">Search Challenge &amp; My Sites</h2>
<div class="grid g2">
<div class="card"><span class="tag">Part A · Search challenge</span><p>Find each and write down the <b>web address</b> you used:<br>1. Your library's open hours · 2. The California DMV site (it ends in <span class="url">.gov</span>) · 3. A job board you would use</p></div>
<div class="card"><span class="tag">Part B · Build My Sites</span><p>Create a <b>My Sites</b> folder on the favorites bar and save <b>three</b> sites you will really use into it.</p></div>
</div>
<div class="callout"><span class="tag">Done when</span><p>Your favorites bar shows <b>My Sites</b>, it holds three sites, none says <b>Not secure</b>, and you read every address.</p></div>
<p class="hint">On a Mac? Same lab in Safari — <span class="kbd">⌘ Cmd</span>+<span class="kbd">D</span> saves to Favorites. Stretch: use <span class="url">site:.gov</span> to find a free benefits program in Contra Costa County.</p>
</div>`,
n:"Circulate. Watch for people clicking Sponsored results and for favorites saved to 'Other favorites' instead of the bar. The DMV answer is dmv.ca.gov."},

{h:"Lecture 3",c:"Checkpoint",t:"3 min",html:`
<h2><span class="n">Checkpoint</span>Five quick questions</h2>
<div class="qa"><div class="q">1. You know the address. Where do you type it — the address bar or a search?</div><div class="a">The address bar. It goes straight there — no ads, no look-alikes.</div></div>
<div class="qa"><div class="q">2. In <b>ssa.gov.benefits-check.com</b>, who are you really visiting?</div><div class="a">benefits-check.com — the name right before the ending.</div></div>
<div class="qa"><div class="q">3. What does the word “Sponsored” on a result mean?</div><div class="a">It is a paid ad.</div></div>
<div class="qa"><div class="q">4. Closed a tab by mistake? What do you press (Windows, then Mac)?</div><div class="a">Windows: Ctrl + Shift + T. Mac: ⌘ Command + Shift + T.</div></div>
<div class="qa"><div class="q">5. How do you save a site to your favorites bar?</div><div class="a">Click the star (or Ctrl + D) → Favorites bar → Done.</div></div>
<p class="hint">Press A (or the Answers button) to show the answers.</p>`,
n:"If more than two people miss question 2, redo the look-alike slide before the break — Lecture 4 builds on it."},

{h:"Lecture 3",c:"Summary",t:"1 min",html:`
<h2><span class="n">Lecture 3 complete</span>What you can now do</h2>
<ul>
<li>Tell a browser from a search engine</li>
<li>Use tabs, Back, Refresh, zoom, and find on page</li>
<li>Read a web address and spot a look-alike</li>
<li>Search with quotes, minus, OR, and site:, and recognize ads</li>
<li>Find your way around a website and save it to <b>My Sites</b></li>
<li>Do it all on a Mac in Safari — ⌘ Command in place of Ctrl</li>
</ul>
<div class="callout"><span class="tag">Next</span><p>Ten-minute break. Back at <b>1:00</b> for Lecture 4 — keeping your accounts and money safe online.</p></div>`,
n:"12:50 out, 1:00 back. Laptops to Sleep (Windows: Start › Power › Sleep · Mac: Apple menu › Sleep)."},

/* ============================== LECTURE 4 · STAYING SAFE ONLINE ============================== */
{h:"Lecture 4",c:"Lecture cover",t:"1:00–1:50",html:`
<div class="cover">
  <div class="eyebrow">Class 2 · Lecture 4 · C2-L2</div>
  <h1>Staying Safe<br>Online</h1>
  <div class="meta">
    <b>Covers</b>Secure websites · strong passphrases · 2-step verification · scams · Mac safety settings<br>
    <b>Timing</b>Teach 31 min · Hands-on lab 15 min · Checkpoint 4 min<br>
    <b>You build</b>A passphrase you can remember — and a plan to protect your email
  </div>
</div>`,
n:"Tone matters this hour: strengths-based, never shaming. Many people in the room have been targeted by a scam. Do not ask anyone to share details they don't offer."},

{h:"Lecture 4",c:"Objectives",t:"1 min",html:`
<h2><span class="n">Why this matters</span>Your information is worth money to someone else</h2>
<p class="lead">Online accounts hold your bank details, benefits, health records, and job applications. A few habits keep them yours.</p>
<div class="obj"><span class="tag">By the end of this lecture you can</span>
<ul>
<li>Tell a secure connection from an unsafe one</li>
<li>Create a strong passphrase you can actually remember</li>
<li>Explain 2-step verification and why it stops most break-ins</li>
<li>Recognize phishing and social-engineering scams — and know what to do</li>
<li>Turn on the safety settings built into a Mac</li>
</ul></div>`,
n:"Ask: 'Why do we need to be careful online?' Take two answers, then move on."},

{h:"Lecture 4",c:"Concept",t:"1 min",html:`
<h2><span class="n">What cybersecurity means</span>Two goals for everyday people</h2>
<div class="grid g2">
<div class="card good"><span class="tag">Goal 1</span><h3>Your information stays yours</h3><p>Only you — and people you choose — can see your accounts, passwords, and personal details.</p></div>
<div class="card good"><span class="tag">Goal 2</span><h3>Your devices stay healthy</h3><p>Your laptop and phone work properly and are free of <b>malware</b>.</p></div>
</div>
<div class="callout"><span class="tag">Malware</span><p>Malicious software: viruses that damage devices, spyware that watches what you do, and adware that floods you with pop-ups. It usually gets in through a link or download you were tricked into opening.</p></div>`,
n:"Keep the definitions short. The rest of the hour is about the habits that achieve these two goals."},

{h:"Lecture 4",c:"Concept",t:"2 min",html:`
<h2><span class="n">Secure websites</span>Look for the warning, not the lock</h2>
<svg class="dg" viewBox="0 0 860 280" role="img" aria-label="Three address bars for ssa.gov: Edge shows a padlock, Chrome shows a sliders icon, Safari shows nothing extra. All three are encrypted. A fourth address bar says Not secure for an http site, where you should never type personal information.">
<rect class="ui2" x="30" y="6" width="500" height="42" rx="23"/>
<g transform="translate(54,16) scale(1.1)">`+LOCK+`</g><text class="t-m" x="86" y="34">ssa.gov</text>
<text class="t-s" x="550" y="33" font-weight="700">Edge</text><text class="t-s t-mut" x="610" y="33">padlock</text>
<rect class="ui2" x="30" y="56" width="500" height="42" rx="23"/>
<g stroke="#231F20" stroke-width="2.4" fill="none"><line x1="52" y1="71" x2="74" y2="71"/><line x1="52" y1="83" x2="74" y2="83"/></g><circle class="ink" cx="58" cy="71" r="4"/><circle class="ink" cx="68" cy="83" r="4"/>
<text class="t-m" x="86" y="84">ssa.gov</text>
<text class="t-s" x="550" y="83" font-weight="700">Chrome</text><text class="t-s t-mut" x="625" y="83">sliders icon</text>
<rect class="ui2" x="30" y="106" width="500" height="42" rx="23"/>
<text class="t-m" x="280" y="134" text-anchor="middle">ssa.gov</text>
<text class="t-s" x="550" y="133" font-weight="700">Safari (Mac)</text><text class="t-s t-mut" x="665" y="133">nothing extra</text>
<text class="t-m t-green" x="30" y="178">✔  No warning = the connection is encrypted, in all three browsers.</text>
<rect class="flagsoft" x="30" y="192" width="800" height="48" rx="24"/>
<path d="M62,201 L77,229 L47,229 Z" fill="none" stroke="#C22222" stroke-width="2.5" stroke-linejoin="round"/><text class="t-s t-red" x="62" y="226" text-anchor="middle">!</text>
<text class="t-m t-red" x="92" y="223">Not secure</text><line class="wire" x1="194" y1="203" x2="194" y2="229"/>
<text class="t-l" x="208" y="224">http://free-gift-card-claim.biz</text>
<text class="t-m t-red" x="30" y="268">✖  “Not secure” in any browser — never type a password or card number here.</text>
</svg>
<div class="callout"><span class="tag">Check any site</span><p>Click the icon at the left of the address to see <b>Connection is secure</b>. In Safari on a Mac: <b>Safari › Connection Security Details</b>.</p></div>`,
n:"Updated rule. Chrome swapped the padlock for a sliders icon in 2023, and Safari stopped showing one in 2025 (Safari 18.4), because people read the padlock as 'this site is honest.' The warning to teach is the one every browser shows: Not secure. Click the site-info icon on the projector to show Connection is secure."},
{h:"Lecture 4",c:"Concept",t:"1 min",html:`
<h2><span class="n">An important catch</span>Secure is not the same as honest</h2>
<div class="grid g2">
<div class="card good"><span class="tag">What “secure” means</span><h3>The connection is private</h3><p>Nobody in between — like someone on the same café Wi-Fi — can read what you send.</p></div>
<div class="card bad"><span class="tag">What it does not mean</span><h3>The site is honest</h3><p>Scam sites get secure connections too. No warning on <span class="url">benefits-check.com</span> just means you're privately talking to a scammer.</p></div>
</div>
<div class="callout"><span class="tag">The two-part check</span><p><b>1.</b> No <b>Not secure</b> warning. <b>2.</b> The name before the ending is who you expect. You need <b>both</b>.</p></div>`,
n:"This corrects the old rule of thumb that padlock means safe — the reason Chrome and Safari dropped the padlock. It connects directly to the look-alike address from Lecture 3."},

{h:"Lecture 4",c:"On a Mac",t:"2 min",html:`
<h2><span class="n">On a Mac</span>Turn on Safari's built-in alarms</h2>
<ol class="steps">
<li>In Safari, click <b>Safari › Settings</b> in the menu bar, then the <b>Security</b> tab.</li>
<li>Keep <b>Warn when visiting a fraudulent website</b> checked. Safari stops you before a known phishing site opens.</li>
<li>If you see <b>Warn before connecting to a website over HTTP</b>, check it too.</li>
<li>To check any page: <b>Safari › Connection Security Details</b>.</li>
</ol>
<div class="callout caution"><span class="tag">If Safari warns you</span><p>Close the tab. Never click past a warning on a page that wants a password or a payment.</p></div>`,
n:"The fraud warning is on by default — the point is to know where it lives and not to switch it off. The HTTP option only appears on newer versions of Safari."},
{h:"Lecture 4",c:"Concept",t:"2 min",html:`
<h2><span class="n">Strong passwords</span>Length beats complexity</h2>
<svg class="dg" viewBox="0 0 880 290" role="img" aria-label="Bar chart of password length: P@ss1! is 6 characters and weak; Summer2026! is 11 characters and a common pattern; cowshelpmakecheese is 18 characters and strong; Cows-Help-Make-Cheese-7 is 23 characters and strongest.">
<g class="t-m">
<text class="t-mono" x="30" y="52">P@ss1!</text><text class="t-mono" x="30" y="117">Summer2026!</text><text class="t-mono" x="30" y="182">cowshelpmakecheese</text><text class="t-mono" x="30" y="247">Cows-Help-Make-Cheese-7</text>
</g>
<rect class="flagsoft" x="300" y="30" width="96" height="32" rx="4"/><text class="t-s t-red" x="408" y="52">6 characters · weak</text>
<rect class="flagsoft" x="300" y="95" width="176" height="32" rx="4"/><text class="t-s t-red" x="488" y="117">11 · common pattern, easy to guess</text>
<rect class="limesoft" x="300" y="160" width="288" height="32" rx="4"/><text class="t-s t-green" x="600" y="182">18 · strong</text>
<rect class="lime" x="300" y="225" width="368" height="32" rx="4"/><text class="t-s t-green" x="680" y="247">23 · strongest</text>
</svg>
<div class="callout"><span class="tag">Why</span><p>Every extra character multiplies the guesses a computer must make. A few ordinary words strung together beat a short jumble of symbols — and you can remember them.</p></div>`,
n:"The bars show length only — the point is visual: longer is stronger. Use the passphrases on this slide as examples only; nobody should use them for real."},

{h:"Lecture 4",c:"Concept",t:"3 min",html:`
<h2><span class="n">Build a passphrase</span>Four random words, then the site's rules</h2>
<ol class="steps">
<li>Pick <b>four unrelated words</b> you can picture: <b>cows · help · make · cheese</b>.</li>
<li>Join them. Aim for <b>15 characters or more</b>: <span class="url">cowshelpmakecheese</span></li>
<li>If the site requires them, add a <b>capital</b>, a <b>number</b>, and a <b>symbol</b>: <span class="url">Cows-Help-Make-Cheese-7</span></li>
<li>Use a <b>different</b> passphrase for every important account — especially email and banking.</li>
</ol>
<div class="callout"><span class="tag">Site rules</span><p>Requirements are usually listed under the password box, or appear after a try is rejected. Read them, then adjust.</p></div>`,
n:"Strengths-based: if someone shares a current method, don't shame it — show how to make it longer. Never ask anyone to say a real password out loud."},

{h:"Lecture 4",c:"Concept",t:"1 min",html:`
<h2><span class="n">Password don'ts</span>Five habits that put accounts at risk</h2>
<div class="grid g2">
<div class="card bad"><h3>Common words</h3><p><b>password</b>, <b>123456</b>, or <b>qwerty</b> are the first things guessed.</p></div>
<div class="card bad"><h3>Personal information</h3><p>Names, birthdays, addresses, and pets are easy to find online.</p></div>
<div class="card bad"><h3>Reusing one password</h3><p>When one site is breached, criminals try that password everywhere else.</p></div>
<div class="card bad"><h3>Sharing it</h3><p>No real bank, agency, or tech company will ever ask for your password.</p></div>
</div>
<div class="callout caution"><span class="tag">And</span><p>No sticky notes on the screen or under the keyboard.</p></div>`,
n:"Reuse is the big one. Ask: 'If your Netflix password leaked, what else would it open?'"},

{h:"Lecture 4",c:"Concept",t:"1 min",html:`
<h2><span class="n">Keeping track</span>Three safe ways to remember them</h2>
<div class="grid g3">
<div class="card"><span class="tag">1 · Notebook</span><h3>Written, kept private</h3><p>A notebook stored somewhere safe at home — not in your bag. Write a <b>hint</b> instead of the whole password if you can.</p></div>
<div class="card"><span class="tag">2 · Password manager</span><h3>One vault, one master passphrase</h3><p>An app that remembers every password and creates strong new ones. Bitwarden is a free, reputable option.</p></div>
<div class="card"><span class="tag">3 · Passphrase</span><h3>Memorable by design</h3><p>Four pictured words are far easier to recall than <b>Xk9#q</b>.</p></div>
</div>`,
n:"Meet people where they are. A notebook kept safely at home is far better than one reused password. Password managers are the long-term goal."},

{h:"Lecture 4",c:"On a Mac",t:"2 min",html:`
<h2><span class="n">On a Mac</span>The Passwords app remembers them for you</h2>
<div class="grid g2">
<div class="card good"><span class="tag">When you sign up</span><h3>Safari suggests a strong one</h3><p>Click a new-password box and Safari offers a long, random password in a yellow box. Accept it and your Mac saves it.</p></div>
<div class="card good"><span class="tag">When you need it</span><h3>Open the Passwords app</h3><p>Press <span class="kbd">⌘ Cmd</span>+<span class="kbd">Space</span>, type <b>Passwords</b>, press <span class="kbd">Return</span>, and unlock it with your Mac password or Touch ID.</p></div>
</div>
<div class="callout"><span class="tag">Good to know</span><p>The app flags passwords you've reused or that showed up in a data breach. With iCloud Keychain on, they sync to your iPhone too. Older Mac? Look in <b>System Settings › Passwords</b>.</p></div>`,
n:"This is option 2 from the last slide, already installed on every newer Mac. Windows users: Edge and Chrome offer the same 'suggest a strong password' feature, and Bitwarden works on both."},
{h:"Lecture 4",c:"Concept",t:"2 min",html:`
<h2><span class="n">2-step verification</span>A second lock on your most important accounts</h2>
<svg class="dg" viewBox="0 0 880 280" role="img" aria-label="Diagram: your password plus a code sent to your phone together open the account. A scammer with only the password is blocked.">
<defs><marker id="ar6" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#3F6B0A"/></marker></defs>
<rect class="ui" x="20" y="40" width="240" height="130" rx="12"/>
<text class="t-l" x="140" y="76" text-anchor="middle">1 · Your password</text><text class="t-s t-mut" x="140" y="98" text-anchor="middle">something you know</text>
<text class="t-l" x="140" y="140" text-anchor="middle">••••••••••••</text>
<text x="290" y="118" text-anchor="middle" font-size="40" font-weight="800" fill="#3F6B0A">+</text>
<rect class="ui" x="320" y="40" width="240" height="130" rx="12"/>
<text class="t-l" x="440" y="76" text-anchor="middle">2 · Code on your phone</text><text class="t-s t-mut" x="440" y="98" text-anchor="middle">something you have</text>
<text class="t-l t-green t-mono" x="440" y="142" text-anchor="middle">482 913</text>
<line class="wire-l" x1="570" y1="105" x2="625" y2="105" marker-end="url(#ar6)"/>
<rect class="limesoft" x="635" y="40" width="225" height="130" rx="12"/>
<text class="t-l" x="747" y="96" text-anchor="middle">Account opens</text><text class="t-s" x="747" y="120" text-anchor="middle">only when both match</text>
<rect class="flagsoft" x="20" y="200" width="840" height="56" rx="10"/>
<text class="t-m" x="440" y="234" text-anchor="middle"><tspan class="t-red">Scammer stole your password?</tspan> Without your phone, they still can't get in.</text>
</svg>
<div class="callout"><span class="tag">Turn it on first for</span><p><b>Email</b> (it resets every other password), <b>banking</b>, and <b>government accounts</b>. Look in the account's <b>Security</b> settings for “2-step verification” or “two-factor.”</p></div>`,
n:"Never share a verification code with anyone — a real company will never call and ask for it. That single rule stops a huge share of account takeovers."},

{h:"Lecture 4",c:"On a Mac",t:"2 min",html:`
<h2><span class="n">On a Mac</span>Four settings worth checking at home</h2>
<div class="grid g2">
<div class="card"><span class="tag">1 · Updates</span><h3>Keep macOS current</h3><p><b>Apple menu › System Settings › General › Software Update</b>. Turn on automatic updates — they patch security holes.</p></div>
<div class="card"><span class="tag">2 · Firewall</span><h3>Block unwanted connections</h3><p><b>System Settings › Network › Firewall</b>, then switch it on.</p></div>
<div class="card"><span class="tag">3 · Apple Account</span><h3>2-step is built in</h3><p><b>System Settings ›</b> your name <b>› Sign-In &amp; Security</b>. Two-factor authentication should say <b>On</b>.</p></div>
<div class="card"><span class="tag">4 · Apps</span><h3>Install from trusted places</h3><p>The <b>App Store</b> or the maker's own website. If your Mac says an app can't be opened, don't force it.</p></div>
</div>`,
n:"Menu names are for recent macOS (System Settings). Older Macs say System Preferences, and the Apple Account page may say Password and Security. Windows equivalent for the room: Settings › Windows Update."},
{h:"Lecture 4",c:"Concept",t:"1 min",html:`
<h2><span class="n">Online scams</span>Two common tricks</h2>
<div class="grid g2">
<div class="card bad"><span class="tag">Phishing</span><h3>Fake messages that “fish” for information</h3><p>An email or text that looks like your bank, a delivery company, or a government agency — with a link to a fake site that collects your login or card number.</p></div>
<div class="card bad"><span class="tag">Social engineering</span><h3>A con artist who earns your trust</h3><p>A caller or message pretending to be a relative in trouble, tech support, or a prize office — to get money or information from you.</p></div>
</div>
<div class="callout"><span class="tag">Where they show up</span><p>Email · text messages · phone calls · pop-ups that say your computer is infected · social media messages</p></div>`,
n:"Invite one or two examples from the room, briefly. Thank people for sharing — never imply anyone who was fooled was foolish. These scams are built by professionals."},

{h:"Lecture 4",c:"Concept",t:"2 min",html:`
<h2><span class="n">Spot a scam</span>Six questions to ask any message</h2>
<div class="grid g3">
<div class="card"><h3>1. Do I know them?</h3><p>Have you heard of this person or organization?</p></div>
<div class="card"><h3>2. Who really sent it?</h3><p>Does the sender's address match the real organization?</p></div>
<div class="card"><h3>3. Any mistakes?</h3><p>Misspellings, odd grammar, a generic “Dear Customer”?</p></div>
<div class="card"><h3>4. Are they asking for information?</h3><p>Passwords, codes, card or Social Security numbers?</p></div>
<div class="card"><h3>5. Are they rushing me?</h3><p>“Act now,” “within 24 hours,” “or your account closes.”</p></div>
<div class="card"><h3>6. Too good to be true?</h3><p>A prize, refund, or gift card you never expected.</p></div>
</div>`,
n:"One 'yes' is enough to stop and verify on your own. Scammers rely on urgency to keep you from thinking."},

{h:"Lecture 4",c:"Concept",t:"2 min",html:`
<h2><span class="n">Anatomy of a phishing email</span>Six warning signs in one message</h2>
<div class="fig wide">
<svg class="dg" viewBox="0 0 880 420" role="img" aria-label="Annotated phishing email with six warning signs: mismatched sender address, urgent subject, generic greeting, spelling mistakes, a verify button, and an unexpected attachment.">
<rect class="ui" x="20" y="10" width="770" height="400" rx="10"/>
<text class="t-m" x="45" y="50" font-weight="700">From:</text><text class="t-m" x="115" y="50">SecureBank Alerts &lt;alerts@<tspan class="t-red">secur3bank-verify.co</tspan>&gt;</text>
<text class="t-m" x="45" y="84" font-weight="700">Subject:</text><text class="t-m" x="130" y="84">URGENT: Your account will be suspended in 24 hours</text>
<line class="wire" x1="21" y1="104" x2="789" y2="104" opacity=".5"/>
<text class="t-m" x="45" y="142">Dear Valued Customer,</text>
<text class="t-m" x="45" y="180">We detected unusual <tspan class="t-red">activty</tspan> on your <tspan class="t-red">acount</tspan>.</text>
<text class="t-m" x="45" y="208">Confirm your identity now or your account will be closed.</text>
<rect class="lime" x="45" y="232" width="200" height="46" rx="6"/><text class="t-m" x="145" y="261" text-anchor="middle" font-weight="700">Verify Now</text>
<rect class="ui2" x="45" y="304" width="340" height="40" rx="6"/><text class="t-m" x="62" y="330">📎  Account_Statement.zip</text>
<text class="t-s t-mut" x="45" y="390">SecureBank Security Team</text>
<g class="co"><circle cx="820" cy="45" r="15"/><text x="820" y="45">1</text></g>
<g class="co"><circle cx="820" cy="80" r="15"/><text x="820" y="80">2</text></g>
<g class="co"><circle cx="270" cy="137" r="15"/><text x="270" y="137">3</text></g>
<g class="co"><circle cx="440" cy="175" r="15"/><text x="440" y="175">4</text></g>
<g class="co"><circle cx="270" cy="255" r="15"/><text x="270" y="255">5</text></g>
<g class="co"><circle cx="410" cy="324" r="15"/><text x="410" y="324">6</text></g>
</svg>
<ol class="legend cols">
<li data-n="1"><b>Sender</b> — a look-alike address, not the bank's</li>
<li data-n="2"><b>Urgency</b> — a deadline to rush you</li>
<li data-n="3"><b>Generic greeting</b> — your bank knows your name</li>
<li data-n="4"><b>Spelling mistakes</b></li>
<li data-n="5"><b>A button to “verify”</b> — leads to a fake sign-in page</li>
<li data-n="6"><b>Unexpected attachment</b> — may contain malware</li>
</ol>
</div>`,
n:"SecureBank is a made-up name for this example. Walk the numbers in order. Real organizations do send emails — the difference is they never pressure you to sign in through a link."},

{h:"Lecture 4",c:"Interactive",t:"3 min",html:`
<h2><span class="n">Your turn</span>Find the four warning signs</h2>
<div class="split">
<div class="msg" data-drill data-done="All 4 found — a scary deadline, a small fee, a fake address, and a request to act through the link.">
<div class="hdr">Text message · from +1 (213) 555-0148</div>
US Postal Service: Your package is on hold due to an <span class="flag">unpaid $1.99 redelivery fee</span>. <span class="flag">Pay within 12 hours</span> or it will be returned to sender. Update your details at <span class="flag">usps-redelivery-help.com</span> — <span class="flag">tap the link to confirm</span>.
</div>
<div>
<p class="lead">Click each part of the message that should make you stop.</p>
<span class="drill-count">0 of 4 found</span>
<div class="callout"><span class="tag">What to do instead</span><p>Don't tap. Track the package yourself by typing <span class="url">usps.com</span> into the address bar. Forward scam texts to <b>7726</b> (SPAM), then delete.</p></div>
</div>
</div>`,
n:"Let the room call out answers while you click. The real Postal Service does not text you asking for fees. The 555 phone number is fictional."},

{h:"Lecture 4",c:"Concept",t:"1 min",html:`
<h2><span class="n">Dos and don'ts</span>When a message feels off</h2>
<div class="grid g2">
<div>
<table>
<tr><th>Don't</th></tr>
<tr><td>✖ Give personal information, passwords, or codes</td></tr>
<tr><td>✖ Reply or call the number in the message</td></tr>
<tr><td>✖ Click links or buttons in it</td></tr>
<tr><td>✖ Open or download attachments</td></tr>
</table>
</div>
<div>
<table>
<tr><th>Do</th></tr>
<tr><td>✔ Be skeptical — if it feels off, it probably is</td></tr>
<tr><td>✔ Read the sender and the links carefully</td></tr>
<tr><td>✔ Look it up yourself: type the real address, or call the number on your card</td></tr>
<tr><td>✔ Mark it as spam or junk, then delete it</td></tr>
</table>
</div>
</div>`,
n:"The golden rule: go to the source yourself. Never use the contact details inside a suspicious message."},

{h:"Lecture 4",c:"Concept",t:"2 min",html:`
<h2><span class="n">If you already clicked</span>Act fast — it is fixable</h2>
<ol class="steps">
<li><b>Change the password</b> — on that account and anywhere you reused it — and <b>turn on 2-step verification</b>.</li>
<li><b>Gave card or bank details?</b> Call the number on the back of your card right away.</li>
<li><b>Report it:</b> <span class="url">ReportFraud.ftc.gov</span>. If someone used your identity: <span class="url">IdentityTheft.gov</span>.</li>
<li><b>Ask for help</b> — Tech Exchange, your library, or someone you trust. It is not your fault.</li>
</ol>
<div class="callout caution"><span class="tag">Fake “virus” pop-up froze the screen?</span><p>Don't call the number. Windows: <span class="kbd">Ctrl</span>+<span class="kbd">Shift</span>+<span class="kbd">Esc</span> › End task · Mac: <span class="kbd">⌘ Cmd</span>+<span class="kbd">Option</span>+<span class="kbd">Esc</span> › Force Quit.</p></div>`,
n:"End the content on agency, not fear. Scams succeed against smart people every day; what matters is acting quickly. Pop-up tip: on a Mac, reopen Safari while holding Shift so the scam page does not reload."},

{h:"Lecture 4",c:"Hands-on lab",t:"15 min",html:`
<div class="lab">
<span class="badge">Lab 4 · 15 minutes</span>
<h2 style="margin-bottom:.4em">Lock It Down</h2>
<div class="grid g3">
<div class="card"><span class="tag">Part A · Secure-site check</span><p>Open two sites from <b>My Sites</b>. For each, confirm there is <b>no Not secure warning</b> and read the <b>name</b> before the ending.</p></div>
<div class="card"><span class="tag">Part B · Your passphrase</span><p>On your paper card, build a <b>4-word passphrase</b> of 15+ characters, then add a capital, number, and symbol.</p></div>
<div class="card"><span class="tag">Part C · Your plan</span><p>Write down the <b>one account</b> you will turn on 2-step verification for this week. Email is the best choice. Mac at home? Add <b>Software Update</b> to your list.</p></div>
</div>
<div class="callout caution"><span class="tag">Important</span><p>Practice only — don't type a real password into anything today, and don't share your card. Take it home and keep it private.</p></div>
</div>`,
n:"Hand out the paper cards. Circulate and check passphrase length, not content — never ask people to read them aloud."},

{h:"Lecture 4",c:"Checkpoint",t:"3 min",html:`
<h2><span class="n">Checkpoint</span>Five quick questions</h2>
<div class="qa"><div class="q">1. A site shows no “Not secure” warning. Is that enough to trust it?</div><div class="a">No — also check that the name before the ending is who you expect.</div></div>
<div class="qa"><div class="q">2. Which is stronger: <b>P@ss1!</b> or <b>cowshelpmakecheese</b>?</div><div class="a">cowshelpmakecheese — longer is stronger.</div></div>
<div class="qa"><div class="q">3. Someone calls “from your bank” and asks for the code just texted to you. What do you do?</div><div class="a">Never share it. Hang up and call the number on your card.</div></div>
<div class="qa"><div class="q">4. Name two warning signs of a phishing email.</div><div class="a">Any two: wrong sender address, urgency, generic greeting, mistakes, a verify link, an unexpected attachment.</div></div>
<div class="qa"><div class="q">5. You get a prize email you think is a scam. What should you do?</div><div class="a">Don't click or reply — mark it as spam and delete it.</div></div>
<p class="hint">Press A (or the Answers button) to show the answers.</p>`,
n:"Question 3 is the single most valuable rule of the day. Make sure everyone can say it."},

{h:"Lecture 4",c:"Summary",t:"1 min",html:`
<h2><span class="n">Lecture 4 complete</span>What you can now do</h2>
<ul>
<li>Check for <b>no Not secure warning</b> <b>and</b> the right name before signing in</li>
<li>Build a long passphrase and use a different one for important accounts</li>
<li>Turn on 2-step verification — and never share a code</li>
<li>Recognize phishing and social engineering using six questions</li>
<li>Know exactly what to do if you clicked</li>
<li>On a Mac: keep Safari's fraud warning on, updates automatic, and let Passwords remember them</li>
</ul>
<div class="callout"><span class="tag">Next</span><p>Wrap-up: questions, where to keep practicing, and we shut down together.</p></div>`,
n:"Transition straight into the close-out."},

/* ============================== CLOSE-OUT ============================== */
{h:"Close-out",c:"Shut down",t:"2 min",html:`
<h2><span class="n">Before you go</span>Shut down the right way</h2>
<ol class="steps">
<li>Save anything open: <span class="kbd">Ctrl</span>+<span class="kbd">S</span>.</li>
<li>Click <b>Start</b>, then the <b>Power</b> icon.</li>
<li>Choose <b>Shut down</b>.</li>
<li>Wait until the screen is completely black, then close the lid.</li>
</ol>
<div class="callout caution"><span class="tag">Caution</span><p>Don't close the lid before the screen goes black. Only hold the power button to force it off if the laptop has stopped responding completely.</p></div>`,
n:"Do it on the projector, then have the whole room do it together. Wait for the black screens before anyone closes a lid."},
