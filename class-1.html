{h:"Lecture 1",c:"Objectives",t:"1 min",html:`
<h2><span class="n">Why this matters</span>The parts you touch every minute</h2>
<p class="lead">You will spend more time on the touchpad and keyboard than on anything else this laptop does. Thirty minutes here saves hours later.</p>
<div class="obj"><span class="tag">By the end of this lecture you can</span>
<ul>
<li>Name the four jobs inside every computer: input, processing, storage, output</li>
<li>Hover, click, double-click, right-click, drag, and scroll — with a mouse or a touchpad</li>
<li>Find the command keys and use the shortcuts that save the most time</li>
<li>Sit and place your hands correctly, and practice typing on TypingClub</li>
</ul></div>`,
n:"Read the objectives out loud. Adults want to know the destination before the trip."},

{h:"Lecture 1",c:"Concept",t:"3 min",html:`
<h2><span class="n">How a computer works</span>Four jobs, one machine</h2>
<div class="fig">
<svg class="dg" viewBox="0 0 820 430" role="img" aria-label="Diagram: input devices send information to the processor, which sends results to output devices. Memory and storage connect to the processor.">
<defs><marker id="ar1" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#3F6B0A"/></marker></defs>
<rect class="ui" x="20" y="30" width="220" height="245" rx="12"/><rect class="lime" x="20" y="30" width="220" height="50" rx="12"/><rect class="lime" x="20" y="62" width="220" height="18"/>
<text class="t-l" x="130" y="62" text-anchor="middle">INPUT</text>
<text class="t-m" x="40" y="115">Keyboard</text><text class="t-m" x="40" y="145">Mouse / touchpad</text><text class="t-m" x="40" y="175">Webcam</text><text class="t-m" x="40" y="205">Microphone</text>
<text class="t-s t-mut" x="40" y="255">You tell the computer</text>
<rect class="ui" x="300" y="30" width="220" height="245" rx="12"/><rect class="lime" x="300" y="30" width="220" height="50" rx="12"/><rect class="lime" x="300" y="62" width="220" height="18"/>
<text class="t-l" x="410" y="62" text-anchor="middle">PROCESSING</text>
<text class="t-m" x="320" y="115">CPU — the brain</text><text class="t-m" x="320" y="145">GPU — draws the</text><text class="t-m" x="320" y="167">picture on screen</text>
<text class="t-s t-mut" x="320" y="255">The computer thinks</text>
<rect class="ui" x="580" y="30" width="220" height="245" rx="12"/><rect class="lime" x="580" y="30" width="220" height="50" rx="12"/><rect class="lime" x="580" y="62" width="220" height="18"/>
<text class="t-l" x="690" y="62" text-anchor="middle">OUTPUT</text>
<text class="t-m" x="600" y="115">Screen</text><text class="t-m" x="600" y="145">Speakers</text><text class="t-m" x="600" y="175">Headphones</text><text class="t-m" x="600" y="205">Printer</text>
<text class="t-s t-mut" x="600" y="255">The computer answers</text>
<line class="wire-l" x1="242" y1="152" x2="296" y2="152" marker-end="url(#ar1)"/>
<line class="wire-l" x1="522" y1="152" x2="576" y2="152" marker-end="url(#ar1)"/>
<line class="wire-l" x1="410" y1="280" x2="410" y2="318" marker-start="url(#ar1)" marker-end="url(#ar1)"/>
<rect class="limesoft" x="170" y="322" width="480" height="96" rx="12"/>
<text class="t-l" x="410" y="352" text-anchor="middle">MEMORY &amp; STORAGE</text>
<text class="t-m" x="410" y="380" text-anchor="middle">RAM — short-term workspace (cleared at shut down)</text>
<text class="t-m" x="410" y="404" text-anchor="middle">SSD / hard drive, flash drive, memory card — keeps files</text>
</svg>
<div>
<p class="lead">Every computer, phone, and tablet does the same four jobs.</p>
<div class="callout"><span class="tag">Troubleshooting tip</span><p>Slow? Usually processing or memory. Not responding to you? Usually input. Knowing the four jobs is most of troubleshooting.</p></div>
</div>
</div>`,
n:"Walk left to right: input, processing, output — then down to memory and storage. Ninety seconds, then move on. This is orientation, not an exam."},

{h:"Lecture 1",c:"Concept",t:"2 min",html:`
<h2><span class="n">Memory vs. storage</span>The desk and the filing cabinet</h2>
<div class="grid g2">
<div class="card"><span class="tag">Memory · RAM</span><h3>Your desk</h3><p>Where the work you have open right now sits. Fast, but cleared when the computer shuts down. More RAM = more programs open at once without slowing down.</p></div>
<div class="card"><span class="tag">Storage · SSD or hard drive</span><h3>Your filing cabinet</h3><p>Where files live when you are not using them. Stays put when the power is off. This is why you <b>save</b> your work.</p></div>
</div>
<div class="grid g2 mt">
<div class="card plain"><h3>Flash drive</h3><p>A filing cabinet that fits on your key ring. Plugs into a USB port.</p></div>
<div class="card plain"><h3>Memory card</h3><p>The small card inside cameras and some phones. Same job, smaller.</p></div>
</div>
<div class="callout"><span class="tag">Remember</span><p>Not saved = still only on the desk. Shut down before saving and it is gone.</p></div>`,
n:"This is the 'why save' slide. In Lecture 2 they save a file — tie it back to the filing cabinet then."},

n:"Have everyone put a finger on the touchpad and move it while you talk. Light touches — the touchpad reads contact, not force."},

{h:"Lecture 1",c:"Concept",t:"3 min",html:`
<h2><span class="n">Six pointer actions</span>Everything you do with the pointer</h2>
<table>
<tr><th>Action</th><th>Mouse</th><th>Touchpad</th><th>Use it to</th></tr>
<tr><td><b>Hover</b></td><td>Move the mouse</td><td>Slide one finger</td><td>Point at something — nothing is selected yet</td></tr>
<tr><td><b>Click</b></td><td>Press left button once</td><td>Tap once</td><td>Select an item, press a button, follow a link</td></tr>
<tr><td><b>Double-click</b></td><td>Two quick left clicks</td><td>Two quick taps</td><td>Open a file, folder, or program</td></tr>
<tr><td><b>Right-click</b></td><td>Press right button</td><td>Tap with two fingers</td><td>Open the menu of extra options</td></tr>
<tr><td><b>Click and drag</b></td><td>Hold left button, move</td><td>Press, hold, slide</td><td>Move a file, highlight text, resize a window</td></tr>
<tr><td><b>Scroll</b></td><td>Roll the wheel</td><td>Slide two fingers</td><td>Move up and down a long page</td></tr>
</table>
<div class="callout"><span class="tag">Tip</span><p>Not sure? Click once first. If nothing useful happens, right-click to see what else is possible.</p></div>`,
n:"Demo each row on the projector, then have the room do it: drag the Recycle Bin icon a few inches and back; right-click the desktop and press Esc to close the menu."},

{h:"Lecture 1",c:"Concept",t:"2 min",html:`
<h2><span class="n">Selecting text</span>Highlight first, then act</h2>
<p class="lead">Before you can copy, delete, or bold text, you select it. It turns highlighted.</p>
<div class="grid g2 mt">
<div class="card"><h3>Click and drag</h3><p>Press at the start of the words, hold, and slide to the end. Let go.</p></div>
<div class="card"><h3>Double-click a word</h3><p>Selects just that one word.</p></div>
<div class="card"><h3>Triple-click</h3><p>Selects the whole paragraph or line.</p></div>
<div class="card"><h3><span class="kbd">Ctrl</span> + <span class="kbd">A</span></h3><p>Selects <b>all</b> — every word on the page or every file in the folder.</p></div>
</div>
<div class="callout"><span class="tag">Note</span><p>Typing while text is highlighted replaces it. If that happens by accident: <span class="kbd">Ctrl</span> + <span class="kbd">Z</span>.</p></div>`,
n:"Most beginners only know drag-to-select, and it is the hardest one on a touchpad. Double-click and Ctrl+A are the easy wins."},

{h:"Lecture 1",c:"Concept",t:"2 min",html:`
<h2><span class="n">Keys that get you out of trouble</span>Four keys to know by touch</h2>
<div class="grid g2">
<div class="card"><h3><span class="kbd">Esc</span> Escape</h3><p>Top-left. Closes a menu or pop-up you did not mean to open, and exits full screen.</p></div>
<div class="card"><h3><span class="kbd">⊞</span> Windows key</h3><p>Bottom row, has the window logo. Opens the Start menu — your way home from anywhere.</p></div>
<div class="card"><h3><span class="kbd">Backspace</span> vs <span class="kbd">Delete</span></h3><p>Backspace erases to the <b>left</b> of the cursor. Delete erases to the <b>right</b> — and sends a selected file to the Recycle Bin.</p></div>
<div class="card"><h3><span class="kbd">Enter</span></h3><p>Says yes: confirms, submits a form, or starts a new line.</p></div>
</div>`,
n:"Wait for every hand to find each key before moving on. The Delete-to-Recycle-Bin point comes back in Lecture 2."},

{h:"Lecture 1",c:"Concept",t:"2 min",html:`
<h2><span class="n">Modifier and toggle keys</span>Keys that change other keys</h2>
<table>
<tr><th>Key</th><th>What it does</th></tr>
<tr><td><span class="kbd">Shift</span></td><td>Hold it for one capital letter, or the symbol printed on top of a number key (<b>Shift + 2</b> = @)</td></tr>
<tr><td><span class="kbd">Caps Lock</span></td><td>An on/off switch: every letter in CAPITALS until you press it again. A small light often shows it is on.</td></tr>
<tr><td><span class="kbd">Ctrl</span></td><td>Control — held with a letter to give a command (copy, paste, save)</td></tr>
<tr><td><span class="kbd">Alt</span></td><td>Alternate — held with another key for more commands (<b>Alt + Tab</b> switches programs)</td></tr>
<tr><td><span class="kbd">Fn</span></td><td>Function — unlocks the second job printed on some keys, like volume and brightness</td></tr>
<tr><td><span class="kbd">Tab</span></td><td>Jumps to the next box in a form</td></tr>
</table>
<div class="callout caution"><span class="tag">Password trouble?</span><p>Check Caps Lock first. It is the most common reason a correct password is rejected.</p></div>`,
n:"The Caps Lock tip prevents a dozen 'my password doesn't work' questions later. Say it twice."},

{h:"Lecture 1",c:"Concept",t:"3 min",html:`
<h2><span class="n">Shortcuts</span>Ten shortcuts worth memorizing</h2>
<div class="split even">
<table>
<tr><th>Press</th><th>To</th></tr>
<tr><td><span class="kbd">Ctrl</span>+<span class="kbd">C</span></td><td>Copy</td></tr>
<tr><td><span class="kbd">Ctrl</span>+<span class="kbd">X</span></td><td>Cut</td></tr>
<tr><td><span class="kbd">Ctrl</span>+<span class="kbd">V</span></td><td>Paste</td></tr>
<tr><td><span class="kbd">Ctrl</span>+<span class="kbd">Z</span></td><td><b>Undo</b></td></tr>
<tr><td><span class="kbd">Ctrl</span>+<span class="kbd">Y</span></td><td>Redo</td></tr>
</table>
<table>
<tr><th>Press</th><th>To</th></tr>
<tr><td><span class="kbd">Ctrl</span>+<span class="kbd">A</span></td><td>Select all</td></tr>
<tr><td><span class="kbd">Ctrl</span>+<span class="kbd">S</span></td><td>Save</td></tr>
<tr><td><span class="kbd">Ctrl</span>+<span class="kbd">P</span></td><td>Print</td></tr>
<tr><td><span class="kbd">Ctrl</span>+<span class="kbd">F</span></td><td>Find a word on the page</td></tr>

</table>
</div>
<div class="callout"><span class="tag">How to press a shortcut</span><p>Hold the first key down, tap the second, then let go of both — just like Shift for a capital letter.</p></div>`,
n:"Live demo of Ctrl+Z: type a sentence in Notepad, select it all, delete it, then undo. The room reacts every time. That one shortcut is why they cannot break the laptop."},

{h:"Lecture 1",c:"Concept",t:"2 min",html:`
<h2><span class="n">Practice tool</span>TypingClub — free typing lessons</h2>
<div class="split">
<div>
<p class="lead">A free website that teaches touch typing one small lesson at a time.</p>
<ul class="mt">
<li><b>Free</b> for individuals and schools</li>
<li><b>No account needed</b> to start. Make a free profile later only if you want to save progress</li>
<li><b>Earn up to 5 stars</b> per lesson. Repeat a lesson to raise your stars</li>
<li>The screen shows <b>which finger</b> to use for every key</li>
</ul>
</div>
<div class="card"><span class="tag">The rule</span><h3>Accuracy first, speed later</h3><p>Slow and correct builds the habit. Speed comes on its own. A few minutes a day for two weeks makes a real difference.</p></div>
</div>
<p class="mt">Address: <span class="url">typingclub.com</span></p>`,
n:"Set expectations: nobody becomes a fast typist today. The goal is to know the tool exists and finish the first few lessons so they can keep going at home or at the library."},

{h:"Lecture 1",c:"Demonstration",t:"3 min",html:`
<h2><span class="n">Watch first</span>Start TypingClub in under a minute</h2>
<ol class="steps">
<li>Press <span class="kbd">⊞</span>, type <b>edge</b>, press <span class="kbd">Enter</span> to open the Microsoft Edge browser.</li>
<li>Click the long bar at the top, type <span class="url">typingclub.com</span>, press <span class="kbd">Enter</span>.</li>
<li>Click <b>Get Started</b>. Skip sign-up — it is optional.</li>
<li>Open <b>Lesson 1</b>. Rest your fingers on the home row — index fingers on the F and J bumps.</li>
<li>Type what the screen shows. Watch the screen, not your hands.</li>
</ol>
<div class="callout"><span class="tag">Important</span><p>Watch me once all the way through. Hands off keyboards — you will do it yourself in a moment.</p></div>`,
n:"Do it on the projector at real speed, then once more narrating each step. Check the site loads on the venue Wi-Fi before class. If TypingClub is blocked or slow, run the Notepad shortcut drill (Part B of the lab) for the full 15 minutes."},

{h:"Lecture 1",c:"Hands-on lab",t:"15 min",html:`
<div class="lab">
<span class="badge">Lab 1 · 15 minutes</span>
<h2 style="margin-bottom:.4em">Keyboard Warm-up</h2>
<div class="grid g2">
<div class="card"><span class="tag">Part A · 10 min</span><h3>TypingClub</h3><p>Open <span class="url">typingclub.com</span> and complete <b>Lessons 1–3</b>. Repeat any lesson below 3 stars.</p></div>
<div class="card"><span class="tag">Part B · 5 min</span><h3>Shortcut drill in Notepad</h3><p>Open Notepad. Type your full name. <span class="kbd">Ctrl</span>+<span class="kbd">A</span> → <span class="kbd">Ctrl</span>+<span class="kbd">C</span> → <span class="kbd">End</span> → <span class="kbd">Enter</span> → <span class="kbd">Ctrl</span>+<span class="kbd">V</span> twice. Then <span class="kbd">Ctrl</span>+<span class="kbd">Z</span>.</p></div>
</div>
<div class="callout"><span class="tag">Done when</span><p>Three TypingClub lessons show stars, and your name appears twice in Notepad after the undo. Leave Notepad open — you use it in Lecture 2.</p></div>
</div>`,
n:"Circulate immediately — do not stand at the front. Watch for fingers drifting off the home row and people looking down at their hands. In Part B, the common slip is pressing the keys one after another instead of holding Ctrl."},

{h:"Lecture 1",c:"Checkpoint",t:"3 min",html:`
<h2><span class="n">Checkpoint</span>Five quick questions</h2>
<div class="qa"><div class="q">1. You want the menu of extra options for a file. What do you do?</div><div class="a">Right-click — or tap with two fingers on the touchpad.</div></div>
<div class="qa"><div class="q">2. You deleted a paragraph by accident. What do you press?</div><div class="a">Ctrl + Z (undo). Press again to go further back.</div></div>
<div class="qa"><div class="q">3. Which is the desk and which is the filing cabinet — RAM or storage?</div><div class="a">RAM is the desk (temporary). Storage is the filing cabinet (keeps files).</div></div>
<div class="qa"><div class="q">4. Your correct password keeps getting rejected. What do you check first?</div><div class="a">Caps Lock.</div></div>
<div class="qa"><div class="q">5. Which two keys have small bumps, and why?</div><div class="a">F and J — so your index fingers find the home row without looking.</div></div>
<p class="hint">Press A (or the Answers button) to show the answers.</p>`,
n:"Ask for hands, not shouted answers. Give fifteen seconds of quiet first. If more than two people miss question 1, re-demo right-click before the break."},

{h:"Lecture 1",c:"Summary",t:"1 min",html:`
<h2><span class="n">Lecture 1 complete</span>What you can now do</h2>
<ul>
<li>Explain input, processing, output, and memory &amp; storage</li>
<li>Hover, click, double-click, right-click, drag, and scroll</li>
<li>Use <span class="kbd">Esc</span> <span class="kbd">⊞</span> <span class="kbd">Shift</span> <span class="kbd">Ctrl</span> <span class="kbd">Alt</span> <span class="kbd">Enter</span> <span class="kbd">Backspace</span> <span class="kbd">Delete</span></li>
<li>Copy, cut, paste, and undo</li>
<li>Find the home row and keep practicing on TypingClub</li>
</ul>
<div class="callout"><span class="tag">Next</span><p>Ten-minute break. Back at <b>2:00</b> for Lecture 2 — Windows 11, where your files live, and how to keep them organized.</p></div>`,
n:"Say the return time out loud and write it on the board: 1:50 out, 2:00 back."},

/* ============================== LECTURE 2 · WINDOWS 11 ============================== */
{h:"Lecture 2",c:"Lecture cover",t:"2:00–2:50",html:`

{h:"Lecture 2",c:"Objectives",t:"1 min",html:`
<h2><span class="n">Why this matters</span>Where did my file go?</h2>
<p class="lead">You will save something today. In three weeks you will want it back. This lecture is about never losing it.</p>
<div class="obj"><span class="tag">By the end of this lecture you can</span>
<ul>
<li>Explain what an operating system does</li>
<li>Name the parts of the desktop, taskbar, and Start menu</li>
<li>Open a program four ways and arrange two windows side by side</li>
<li>Create folders, move files into them, and restore a deleted file</li>
<li>Choose correctly between Lock, Sleep, Restart, and Shut down</li>
</ul></div>`,
n:"Open with the question, not the definition. 'Where did my file go?' is the anxiety they actually have."},

{h:"Lecture 2",c:"Concept",t:"2 min",html:`
<h2><span class="n">The operating system</span>The program that runs everything else</h2>
<div class="fig">

<rect class="limesoft" x="150" y="200" width="460" height="90" rx="10"/><text class="t-l" x="380" y="232" text-anchor="middle">WINDOWS 11 — THE OPERATING SYSTEM</text><text class="t-s" x="380" y="256" text-anchor="middle">starts the computer · runs the apps · keeps track of files</text><text class="t-s" x="380" y="276" text-anchor="middle">lets the keyboard, screen, and Wi-Fi work together</text>

{h:"Lecture 2",c:"Concept",t:"1 min",html:`
<h2><span class="n">Your version</span>Windows 11 — and what about Windows 10?</h2>
<div class="grid g2">
<div class="card good"><span class="tag">On your laptop</span><h3>Windows 11</h3><p>Taskbar icons in the center. Rounded corners. Start opens from the middle of the taskbar.</p></div>
<div class="card plain"><span class="tag">Older computers</span><h3>Windows 10</h3><p>Start button on the far left. Microsoft ended free support on <b>October 14, 2025</b>, so it no longer gets regular security fixes.</p></div>
</div>
<div class="callout"><span class="tag">What that means at home</span><p>A Windows 10 computer still turns on and works. Without security updates it is riskier online, so upgrade or replace it when you can.</p></div>`,
n:"Someone will ask whether their home computer stopped working. It did not — it stopped getting free security updates. Keep it short."},

{h:"Lecture 2",c:"Concept",t:"2 min",html:`

n:"Say the no-wrong-answer line explicitly. Beginners assume there is one correct method and freeze looking for it. Search is the one to recommend — they never have to remember where anything lives."},

{h:"Lecture 2",c:"Concept",t:"2 min",html:`
<h2><span class="n">Create and organize</span>Make a folder, move a file</h2>
<div class="grid g2">
<div>
<h3 style="font-size:1.4rem;margin-bottom:.4em">New folder</h3>
<ol class="steps">
<li>In File Explorer, click <b>⊕ New</b> → <b>Folder</b> (or right-click empty space → <b>New</b> → <b>Folder</b>).</li>
<li>Type the name while it is highlighted.</li>
<li>Press <span class="kbd">Enter</span>.</li>
</ol>
</div>
<div>
<h3 style="font-size:1.4rem;margin-bottom:.4em">Move a file</h3>
<table>
<tr><th>Keys</th><th>With a file</th></tr>
<tr><td><span class="kbd">Ctrl</span>+<span class="kbd">X</span></td><td>Pick it up to move</td></tr>
<tr><td><span class="kbd">Ctrl</span>+<span class="kbd">C</span></td><td>Copy — you end up with two</td></tr>
<tr><td><span class="kbd">Ctrl</span>+<span class="kbd">V</span></td><td>Drop it in this folder</td></tr>
</table>
<p class="small mt">Or drag the file onto the folder.</p>
</div>
</div>
<div class="callout"><span class="tag">Naming tip</span><p>Name folders like drawers at home — <b>Jobs</b>, <b>Health</b>, <b>Taxes 2026</b>. Never <b>New folder (3)</b>.</p></div>`,
n:"The payoff from Lecture 1: the same three keys work on files. No new learning — say that."},

{h:"Lecture 2",c:"Concept",t:"1 min",html:`
<h2><span class="n">The Recycle Bin</span>Deleted is not gone — yet</h2>
<div class="split">
<ol class="steps">
<li>Select a file and press <span class="kbd">Delete</span>. It moves to the <b>Recycle Bin</b>.</li>
<li>Changed your mind? Double-click <b>Recycle Bin</b> on the desktop.</li>
<li>Right-click the file → <b>Restore</b>. It goes back where it was.</li>
</ol>
<div class="callout caution"><span class="tag">Caution</span><p><b>Empty Recycle Bin</b> deletes for good. Files deleted from a flash drive skip the Recycle Bin entirely.</p></div>
</div>`,
n:"Quick demo: delete a test file, restore it. This removes the fear of the Delete key."},

{h:"Lecture 2",c:"Concept",t:"2 min",html:`
<h2><span class="n">Switching and power</span>Leave the right way</h2>
<table>
<tr><th>Option</th><th>Where</th><th>Use it when</th></tr>
<tr><td><b>Lock</b> &nbsp;<span class="kbd">⊞</span>+<span class="kbd">L</span></td><td>Start → your name</td><td>Stepping away for a minute in a public place. Everything stays open; your password unlocks it.</td></tr>
<tr><td><b>Sign out</b></td><td>Start → your name</td><td>Someone else will use the computer. Closes your programs.</td></tr>
<tr><td><b>Sleep</b></td><td>Start → Power</td><td>Short breaks. Wakes up in seconds right where you were.</td></tr>
<tr><td><b>Restart</b></td><td>Start → Power</td><td>After updates, or when something is acting strange.</td></tr>
<tr><td><b>Shut down</b></td><td>Start → Power</td><td>End of the day, or before travel. Fully off.</td></tr>
</table>
<div class="callout caution"><span class="tag">Caution</span><p>Save first — <span class="kbd">Ctrl</span> + <span class="kbd">S</span> — then Sleep or Shut down. Switch between open programs any time with <span class="kbd">Alt</span> + <span class="kbd">Tab</span>.</p></div>`,
n:"The break at 2:50 is a Sleep, not a Shut down — it saves boot time at 3:00. Windows+L is the habit to recommend for libraries and job centers."},

{h:"Lecture 2",c:"Demonstration",t:"3 min",html:`
<h2><span class="n">Watch first</span>Build a drawer and put something in it</h2>
<ol class="steps">
<li>In Notepad, type your name, phone, email, and city. Press <span class="kbd">Ctrl</span>+<span class="kbd">S</span>, choose <b>Documents</b>, name it <b>My Info</b>, click <b>Save</b>.</li>
<li>Press <span class="kbd">⊞</span>+<span class="kbd">E</span>. Click <b>Documents</b>. <b>⊕ New</b> → <b>Folder</b> → name it <b>My Files</b>.</li>
<li>Open <b>My Files</b>. Create <b>Personal</b>, <b>Jobs</b>, and <b>Health</b>.</li>
<li>Go back to Documents. Click <b>My Info.txt</b> once, <span class="kbd">Ctrl</span>+<span class="kbd">X</span>. Open My Files › Personal, <span class="kbd">Ctrl</span>+<span class="kbd">V</span>.</li>
<li>Press <span class="kbd">⊞</span>, type <b>My Info</b> — Windows still finds it.</li>
</ol>`,
n:"Deliberately search for the file after moving it. Watching Windows find it instantly is what makes moving files feel safe."},

{h:"Lecture 2",c:"Hands-on lab",t:"15 min",html:`
<div class="lab">
<span class="badge">Lab 2 · 15 minutes</span>
<h2 style="margin-bottom:.4em">Build Your Filing Cabinet</h2>
<div class="grid g2">
<div class="card"><span class="tag">You will produce</span><p>In <b>Documents</b>: a folder <b>My Files</b> holding <b>Personal</b>, <b>Jobs</b>, and <b>Health</b> — with <b>My Info.txt</b> (your contact card) inside Personal.</p></div>
<div class="card"><span class="tag">Then</span><p>Snap <b>File Explorer</b> and <b>Notepad</b> side by side. Delete a test file and restore it from the Recycle Bin.</p></div>
</div>
<div class="callout"><span class="tag">Done when</span><p>You search <b>My Info</b> from Start, open it, and the address bar shows <span class="url">Documents › My Files › Personal</span>.</p></div>
<p class="hint">Finished early? Pin File Explorer to the taskbar, or snap four windows into quarters.</p>
</div>`,
n:"Watch for two failure points: saving to the wrong folder, and typing the file name before choosing the folder. Also watch for the three folders created beside My Files instead of inside it — the fix is to drag them in."},

{h:"Lecture 2",c:"Checkpoint",t:"3 min",html:`
<h2><span class="n">Checkpoint</span>Five quick questions</h2>
<div class="qa"><div class="q">1. Which two keys open File Explorer?</div><div class="a">Windows key + E.</div></div>
<div class="qa"><div class="q">2. You want to move a file, not duplicate it. Cut or copy?</div><div class="a">Cut — Ctrl + X, then Ctrl + V in the new folder.</div></div>
<div class="qa"><div class="q">3. You deleted the wrong file. Where do you look?</div><div class="a">The Recycle Bin → right-click the file → Restore.</div></div>
<div class="qa"><div class="q">4. You are stepping away from a library computer for a minute. What do you press?</div><div class="a">Windows key + L to lock it.</div></div>
<div class="qa"><div class="q">5. How do you put two windows side by side?</div><div class="a">Hover Maximize and pick a layout — or Windows key + ← / →.</div></div>
<p class="hint">Press A (or the Answers button) to show the answers.</p>`,
n:"Ask for hands. Question 4 is the safety habit that matters most outside class."},

{h:"Lecture 2",c:"Summary",t:"1 min",html:`
<h2><span class="n">Class 1 complete</span>What you can now do</h2>
<ul>

<div class="callout"><span class="tag">Next</span><p>Put your laptop to <b>Sleep</b>. Ten-minute break. Back at <b>3:00</b> for Class 2 — the internet and staying safe online.</p></div>`,
n:"Write 3:00 on the board. Remind them: Sleep, not Shut down."}
