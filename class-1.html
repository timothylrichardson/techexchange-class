<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Class 1 — The Fundamentals | Tech Exchange Digital Literacy</title>
<style>
:root{
  --ink:#231F20; --lime:#99CC33; --slate:#332E2F; --paper:#FFFFFF; --flag:#FF4D4D;
  --muted:#B9B4B5;
  --sans:"IBM Plex Sans","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --mono:"IBM Plex Mono","Courier New",Courier,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--ink); color:var(--paper); font-family:var(--sans);
  overflow:hidden; -webkit-font-smoothing:antialiased;
}
/* ---------- stage ---------- */
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:2.5vh 3vw 9vh}
.slide{display:none;width:100%;max-width:1180px;max-height:100%;overflow-y:auto}
.slide.on{display:block;animation:in .22s ease-out}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.slide.on{animation:none}}

/* ---------- chip strip ---------- */
#chips{position:fixed;top:0;left:0;right:0;height:4.2vh;min-height:34px;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 3vw;border-bottom:1px solid #3d3839;background:var(--ink);z-index:5}
#chipL{font-family:var(--mono);font-size:clamp(11px,1.15vw,14px);letter-spacing:.14em;
  text-transform:uppercase;color:var(--muted)}
#chipR{font-family:var(--mono);font-size:clamp(11px,1.15vw,14px);font-weight:600;
  background:var(--lime);color:var(--ink);padding:.25em .8em;border-radius:2px;letter-spacing:.06em}

/* ---------- footer ---------- */
#foot{position:fixed;bottom:0;left:0;right:0;height:6.4vh;min-height:48px;
  display:flex;align-items:center;justify-content:space-between;padding:0 3vw;
  border-top:1px solid #3d3839;background:var(--ink);z-index:5;gap:1rem}
#brand{display:flex;align-items:center;gap:.6rem;font-weight:900;letter-spacing:-.02em;
  font-size:clamp(12px,1.2vw,15px)}
#brand .mark{width:1.5em;height:1.5em;background:var(--lime);border-radius:3px;
  display:grid;place-items:center;color:var(--ink);font-size:.8em;font-weight:900}
#nav{display:flex;align-items:center;gap:.5rem;font-family:var(--mono);font-size:clamp(11px,1.1vw,13px)}
button{font:inherit;font-family:var(--mono);background:transparent;color:var(--muted);
  border:1px solid #4a4445;border-radius:3px;padding:.35em .7em;cursor:pointer}
button:hover{border-color:var(--lime);color:var(--lime)}
button:focus-visible{outline:3px solid var(--lime);outline-offset:2px}
#count{color:var(--muted);min-width:5.5em;text-align:center}
#bar{position:fixed;bottom:6.4vh;left:0;height:3px;background:var(--lime);z-index:6;transition:width .2s}

/* ---------- type ---------- */
h1{font-size:clamp(2.1rem,5.4vw,4.4rem);font-weight:900;letter-spacing:-.035em;line-height:.98}
h2{font-size:clamp(1.6rem,3.5vw,2.9rem);font-weight:900;letter-spacing:-.03em;line-height:1.04;
  margin-bottom:.6em}
h2 .n{color:var(--lime);font-family:var(--mono);font-size:.45em;font-weight:600;
  letter-spacing:.1em;display:block;margin-bottom:.5em}
p,li{font-size:clamp(1.02rem,1.75vw,1.5rem);line-height:1.5;color:#EDEAEA}
.lead{font-size:clamp(1.15rem,2.1vw,1.75rem);color:var(--paper)}
strong{color:var(--paper);font-weight:700}
.kbd{font-family:var(--mono);background:var(--slate);border:1px solid #4a4445;
  border-radius:3px;padding:.12em .45em;font-size:.9em;color:var(--lime);white-space:nowrap}
ul{list-style:none}
ul li{position:relative;padding-left:1.5em;margin-bottom:.65em}
ul li::before{content:"";position:absolute;left:0;top:.62em;width:.55em;height:.55em;
  background:var(--lime);border-radius:1px}
ol{padding-left:0;counter-reset:s;list-style:none}
ol li{position:relative;padding-left:2.4em;margin-bottom:.7em;counter-increment:s}
ol li::before{content:counter(s);position:absolute;left:0;top:.05em;font-family:var(--mono);
  font-size:.85em;font-weight:600;color:var(--ink);background:var(--lime);width:1.7em;height:1.7em;
  display:grid;place-items:center;border-radius:3px}

/* ---------- components ---------- */
.grid{display:grid;gap:1rem;margin-top:.4em}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:820px){.g2,.g3,.g4{grid-template-columns:1fr}}
.card{background:var(--slate);border-radius:5px;padding:1.1em 1.2em;border-left:3px solid var(--lime)}
.card h3{font-size:clamp(.95rem,1.5vw,1.25rem);font-weight:700;margin-bottom:.35em;color:var(--paper)}
.card p{font-size:clamp(.9rem,1.35vw,1.12rem);color:#CFCACB;line-height:1.42}
.plain{border-left-color:#4a4445}

.callout{border-radius:5px;padding:1em 1.2em;margin-top:1.1em;background:var(--slate);
  border-left:4px solid var(--lime)}
.callout .tag{font-family:var(--mono);font-size:.72em;letter-spacing:.16em;text-transform:uppercase;
  color:var(--lime);font-weight:600;display:block;margin-bottom:.35em}
.callout.caution{border-left-color:var(--flag)}
.callout.caution .tag{color:var(--flag)}
.callout p{font-size:clamp(.95rem,1.5vw,1.25rem)}

.obj{background:var(--slate);border-radius:5px;padding:1.1em 1.3em;margin-top:1em}
.obj .tag{font-family:var(--mono);font-size:.72em;letter-spacing:.16em;text-transform:uppercase;
  color:var(--lime);font-weight:600;display:block;margin-bottom:.6em}

.cover{border-left:5px solid var(--lime);padding-left:clamp(1rem,3vw,2.4rem)}
.cover .eyebrow{font-family:var(--mono);color:var(--lime);letter-spacing:.2em;font-weight:600;
  text-transform:uppercase;font-size:clamp(.75rem,1.3vw,1rem);margin-bottom:1.1em}
.cover .meta{font-family:var(--mono);color:var(--muted);margin-top:1.6em;
  font-size:clamp(.8rem,1.3vw,1.05rem);line-height:1.9}
.cover .meta b{color:var(--lime);font-weight:600}

.steps li{background:var(--slate);border-radius:4px;padding:.75em 1em .75em 3.4em;margin-bottom:.55em}
.steps li::before{left:.8em;top:.75em}

.qa{background:var(--slate);border-radius:5px;padding:1em 1.2em;margin-bottom:.7em}
.qa .q{font-weight:700;font-size:clamp(1rem,1.6vw,1.3rem);margin-bottom:.3em}
.qa .a{color:var(--lime);font-family:var(--mono);font-size:clamp(.88rem,1.4vw,1.1rem)}

table{width:100%;border-collapse:collapse;margin-top:.6em}
th,td{text-align:left;padding:.6em .7em;border-bottom:1px solid #433d3e;
  font-size:clamp(.88rem,1.4vw,1.15rem)}
th{font-family:var(--mono);font-size:.78em;letter-spacing:.12em;text-transform:uppercase;
  color:var(--lime);font-weight:600}

/* scam drill */
.msg{background:var(--slate);border-radius:6px;padding:1.2em 1.4em;font-size:clamp(.95rem,1.55vw,1.25rem);
  line-height:1.65;max-width:44ch;border:1px solid #4a4445}
.flag{background:#4a4445;border-radius:3px;padding:.05em .3em;cursor:pointer;
  border-bottom:2px dotted var(--lime)}
.flag:hover{background:#5a5354}
.flag.hit{background:var(--flag);color:var(--ink);font-weight:700;border-bottom-color:transparent}
#drillCount{font-family:var(--mono);color:var(--lime);font-weight:600;margin-top:.9em;display:block;
  font-size:clamp(.9rem,1.4vw,1.15rem)}

/* notes */
#notes{position:fixed;left:0;right:0;bottom:6.4vh;max-height:42vh;overflow-y:auto;
  background:#171415;border-top:2px solid var(--lime);padding:1.1em 3vw;display:none;z-index:7}
#notes.on{display:block}
#notes h4{font-family:var(--mono);font-size:.78rem;letter-spacing:.16em;text-transform:uppercase;
  color:var(--lime);margin-bottom:.5em}
#notes p{font-size:clamp(.9rem,1.3vw,1.08rem);color:#DAD6D7;line-height:1.55}

/* menu */
#menu{position:fixed;inset:0;background:rgba(20,17,18,.97);z-index:9;display:none;
  padding:6vh 6vw;overflow-y:auto}
#menu.on{display:block}
#menu h3{font-family:var(--mono);color:var(--lime);letter-spacing:.16em;text-transform:uppercase;
  font-size:.85rem;margin:1.4em 0 .6em}
#menu h3:first-child{margin-top:0}
#menu a{display:block;color:#DAD6D7;text-decoration:none;padding:.35em 0;
  font-size:clamp(.92rem,1.4vw,1.15rem);border-bottom:1px solid #2e2a2b}
#menu a:hover,#menu a:focus{color:var(--lime)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<div id="chips"><span id="chipL"></span><span id="chipR"></span></div>
<div id="stage"><div id="slides"></div></div>
<div id="bar" style="width:0"></div>
<div id="notes"><h4>Instructor notes</h4><p id="notesBody"></p></div>
<div id="menu" role="dialog" aria-label="Jump to section"></div>
<div id="foot">
  <div id="brand"><span class="mark">T</span> Tech&nbsp;Exchange &nbsp;·&nbsp; Digital Literacy</div>
  <div id="nav">
    <button id="btnMenu" aria-label="Jump to section">Menu</button>
    <button id="btnNotes" aria-label="Toggle instructor notes">Notes (N)</button>
    <button id="btnPrev" aria-label="Previous slide">←</button>
    <span id="count"></span>
    <button id="btnNext" aria-label="Next slide">→</button>
  </div>
</div>
<script>
const DECK = [

/* ===================== FRONT MATTER ===================== */
{h:"Class 1",c:"Welcome",t:"0:10",html:`
<div class="cover">
  <div class="eyebrow">Essential Digital Literacy · Class 1 of 2</div>
  <h1>The<br>Fundamentals</h1>
  <div class="meta">
    <b>Today</b> &nbsp;Wednesday, September 16, 2026 · 1:00 PM  – 3:00 PM <br>
    <b>Where</b> &nbsp;1721 Broadway, Oakland · MacArthur Meeting Room<br>
  </div>
</div>`,
n:"Sign-in sheet goes around now. Have everyone open the laptop and power on while you talk — the boot takes two minutes and you want that happening in the background."},

{h:"Class 1",c:"Welcome",t:"0:10",html:`
<h2><span class="n">Today's plan</span>Four hours, four topics</h2>
<table>
<tr><th>Hour</th><th>What we cover</th><th>What you walk out with</th></tr>
<tr><td><span class="kbd">11:00</span></td><td>Computer Essentials</td><td>A contact card file you own</td></tr>
<tr><td><span class="kbd">12:00</span></td><td>Windows Fundamentals</td><td>Folders that hold it</td></tr>
<tr><td><span class="kbd">13:10</span></td><td>Internet Fundamentals</td><td>Your own bookmarks</td></tr>
<tr><td><span class="kbd">14:00</span></td><td>Staying Safe Online</td><td>A strong passphrase</td></tr>
</table>
<div class="callout"><span class="tag">Note</span><p>Break every hour. Lunch at 12:40. We finish at 3:00 sharp.</p></div>`,
n:"Point at the artifact column. That is the promise of the day — they leave with four things they made, not four things they watched."},

{h:"Class 1",c:"Welcome",t:"0:10",html:`
<h2><span class="n">Ground rule</span>You cannot break this laptop</h2>
<p class="lead">Nothing you do today is permanent. Every mistake in this room has an undo.</p>
<div class="grid g3" style="margin-top:1.4em">
<div class="card"><h3>Wrong click?</h3><p>Press <span class="kbd">Esc</span>. It backs you out of almost anything.</p></div>
<div class="card"><h3>Deleted something?</h3><p>Press <span class="kbd">Ctrl</span> + <span class="kbd">Z</span>. It undoes your last action.</p></div>
<div class="card"><h3>Totally lost?</h3><p>Raise your hand. That is what I am here for.</p></div>
</div>
<div class="callout"><span class="tag">Important</span><p>Ask the question. If you are wondering, three other people are wondering too.</p></div>`,
n:"Say this slowly. Fear of breaking the machine is the single biggest barrier in this room — more than any skill gap. Come back to Ctrl+Z all day."},

/* ===================== HOUR 1 : C1-L1 ===================== */
{h:"Hour 1 · C1-L1",c:"Module cover",t:"40 min",html:`
<div class="cover">
  <div class="eyebrow">Hour 1 · Module C1-L1</div>
  <h1>Computer<br>Essentials</h1>
  <div class="meta">
    <b>Teach</b> 25 min &nbsp;·&nbsp; <b>Hands-on</b> 12 min &nbsp;·&nbsp; <b>Checkpoint</b> 3 min<br>
    <b>You will build</b> &nbsp;My Info.txt — your own contact card
  </div>
</div>`,
n:"Clock check: you should start this at 11:10 and be at the lab launch by 11:35."},

{h:"Hour 1 · C1-L1",c:"Why this matters",t:"1:30",html:`
<h2><span class="n">Why this matters</span>The parts you touch every minute</h2>
<p class="lead">You will spend more time on the touchpad and keyboard than on anything else this laptop does. Twenty minutes here saves you hours later.</p>
<div class="obj"><span class="tag">By the end of this hour you can</span>
<ul>
<li>Identify the four groups of parts inside your laptop</li>
<li>Move, select, open, and drag using the touchpad</li>
<li>Locate the eight keys that do the most work</li>
<li>Find any program by typing its name</li>
<li>Copy text in one program and paste it into another</li>
</ul></div>`,
n:"Read the objectives out loud. Adults want to know the destination before the trip."},

{h:"Hour 1 · C1-L1",c:"Recall",t:"1:00",html:`
<h2><span class="n">You already know this</span>A laptop is a phone with more room</h2>
<div class="grid g2">
<div class="card"><h3>On your phone</h3><p>You tap an app to open it. You swipe to scroll. You hold and drag to move an icon. You type on a keyboard that appears.</p></div>
<div class="card"><h3>On this laptop</h3><p>You tap the touchpad to open. You slide two fingers to scroll. You press and drag to move. You type on a keyboard that is always there.</p></div>
</div>
<p style="margin-top:1.2em">The ideas are identical. Only the surface changed.</p>`,
n:"Almost everyone in this room has a smartphone. Anchor everything to it — you are teaching a translation, not a new language."},

{h:"Hour 1 · C1-L1",c:"Concept",t:"2:00",html:`
<h2><span class="n">Concept 1 of 9</span>Four groups of parts</h2>
<p>Think of an office. Different departments, one job.</p>
<div class="grid g4" style="margin-top:1em">
<div class="card"><h3>Processing</h3><p>The brain. Does the thinking and the calculating.</p></div>
<div class="card"><h3>Memory &amp; storage</h3><p>Where your files live. Documents, photos, programs.</p></div>
<div class="card"><h3>Input</h3><p>How you talk to it. Touchpad, keyboard, camera, microphone.</p></div>
<div class="card"><h3>Output</h3><p>How it answers you. Screen, speakers, printer.</p></div>
</div>
<div class="callout"><span class="tag">Tip</span><p>When something is slow, it is usually processing or memory. When something will not respond to you, it is usually input. Knowing which group is which is most of troubleshooting.</p></div>`,
n:"Do not linger. This is orientation, not an exam. Ninety seconds and move."},

{h:"Hour 1 · C1-L1",c:"Concept",t:"2:30",html:`
<h2><span class="n">Concept 2 of 9</span>The touchpad is your steering wheel</h2>
<p class="lead">The flat rectangle below the keyboard. Light touches, not hard presses.</p>
<div class="grid g2" style="margin-top:1em">
<div class="card"><h3>Hover</h3><p>Rest one finger and slide. The arrow on screen follows you. Nothing is selected yet.</p></div>
<div class="card"><h3>Tap once</h3><p>One quick, light tap. Selects the thing under the arrow.</p></div>
<div class="card"><h3>Tap twice</h3><p>Two quick taps. Opens a file, folder, or program.</p></div>
<div class="card"><h3>Tap with two fingers</h3><p>Opens the hidden menu of extra options. This is the one people forget.</p></div>
</div>
<div class="callout"><span class="tag">Tip</span><p>Not registering? Use slightly more pressure — but never press hard. The touchpad reads contact, not force.</p></div>`,
n:"Have everyone put a finger on the touchpad and move it while you talk. Physical repetition beats explanation here."},

{h:"Hour 1 · C1-L1",c:"Concept",t:"2:00",html:`
<h2><span class="n">Concept 3 of 9</span>Press and drag</h2>
<p class="lead">Picking something up and putting it somewhere else.</p>
<ol class="steps">
<li>Put the arrow on the thing you want to move.</li>
<li>Press down on the touchpad and keep holding.</li>
<li>Slide your finger. The thing comes with you.</li>
<li>Let go where you want it.</li>
</ol>
<p style="margin-top:.9em">You will use this to move files into folders, to highlight a sentence, and to resize a window by its corner.</p>`,
n:"Demo on the projector once, slowly, then have them drag the Recycle Bin icon a few inches and back."},

{h:"Hour 1 · C1-L1",c:"Concept",t:"2:00",html:`
<h2><span class="n">Concept 4 of 9</span>One finger or two?</h2>
<div class="grid g2">
<div class="card"><h3>One-finger tap — "do it"</h3><p>Open a file. Click a link. Press a button. Select some text. This is the tap you use ninety percent of the time.</p></div>
<div class="card"><h3>Two-finger tap — "what else?"</h3><p>Copy, paste, rename, delete, properties. The menu of things that are not on screen.</p></div>
</div>
<div class="callout"><span class="tag">Tip</span><p>When in doubt, try one finger first. If nothing useful happens, try two fingers to see what else is available.</p></div>`,
n:"This is the single most useful distinction of the hour. Two-finger tap is invisible until someone shows you — most self-taught users never find it."},

{h:"Hour 1 · C1-L1",c:"Concept",t:"1:30",html:`
<h2><span class="n">Concept 5 of 9</span>Your keyboard has neighborhoods</h2>
<div class="grid g3">
<div class="card"><h3>Letters and numbers</h3><p>The middle. Where you write.</p></div>
<div class="card"><h3>Command keys</h3><p>The edges. <span class="kbd">Ctrl</span> <span class="kbd">Alt</span> <span class="kbd">Shift</span> <span class="kbd">Esc</span> <span class="kbd">⊞</span>. They do not type — they instruct.</p></div>
<div class="card"><h3>Arrow keys</h3><p>Bottom right. Move through a document without touching the touchpad.</p></div>
</div>
<p style="margin-top:1.2em">You do not need all 104 keys. You need eight.</p>`,
n:"Transition line. Deliver it and move straight to the next slide."},

{h:"Hour 1 · C1-L1",c:"Concept",t:"2:30",html:`
<h2><span class="n">Concept 6 of 9</span>Four keys that get you out of trouble</h2>
<div class="grid g2">
<div class="card"><h3><span class="kbd">Esc</span> — Escape</h3><p>Backs out. Closes a box you did not mean to open. Exits full screen. Your emergency exit.</p></div>
<div class="card"><h3><span class="kbd">⊞</span> — Windows key</h3><p>Bottom left, has the window logo. Opens the Start menu. Your way home from anywhere.</p></div>
<div class="card"><h3><span class="kbd">Shift</span></h3><p>Hold it for CAPITAL letters and for the symbols printed above the numbers.</p></div>
<div class="card"><h3><span class="kbd">Backspace</span> / <span class="kbd">Delete</span></h3><p>Backspace erases to the <b>left</b>. Delete erases to the <b>right</b>.</p></div>
</div>`,
n:"Have them physically locate each key as you name it. Wait for hands to find it before moving on."},

{h:"Hour 1 · C1-L1",c:"Concept",t:"2:30",html:`
<h2><span class="n">Concept 7 of 9</span>Four keys that save you time</h2>
<div class="grid g2">
<div class="card"><h3><span class="kbd">Ctrl</span> — Control</h3><p>Held with another key, it gives a command. <span class="kbd">Ctrl</span>+<span class="kbd">C</span> copy. <span class="kbd">Ctrl</span>+<span class="kbd">V</span> paste. <span class="kbd">Ctrl</span>+<span class="kbd">S</span> save.</p></div>
<div class="card"><h3><span class="kbd">Ctrl</span> + <span class="kbd">Z</span> — Undo</h3><p>Takes back your last action. Press it again to go back further. The most important two keys on the laptop.</p></div>
<div class="card"><h3><span class="kbd">Alt</span> + <span class="kbd">Tab</span></h3><p>Hold Alt, tap Tab. Switches between the programs you have open.</p></div>
<div class="card"><h3><span class="kbd">Enter</span></h3><p>Says yes. Confirms, submits a form, starts a new line.</p></div>
</div>
<div class="callout"><span class="tag">Important</span><p>If you remember one thing from this hour: <span class="kbd">Ctrl</span> + <span class="kbd">Z</span>. It is why you cannot break this laptop.</p></div>`,
n:"Do the Ctrl+Z demo live: type a sentence in Notepad, delete it all, undo it. The room reacts to this every single time."},

{h:"Hour 1 · C1-L1",c:"Concept",t:"2:00",html:`
<h2><span class="n">Concept 8 of 9</span>Stop hunting. Start typing.</h2>
<p class="lead">You never have to remember where anything lives.</p>
<ol class="steps">
<li>Look at the bottom-left of the screen for the search box or magnifying glass.</li>
<li>Click it and start typing what you want — a few letters is enough.</li>
<li>Windows shows matches instantly. Click the one you want.</li>
</ol>
<div class="callout"><span class="tag">Tip</span><p>Search finds more than programs. Try typing <b>calculator</b>, <b>printer</b>, or even <b>change wallpaper</b>.</p></div>`,
n:"Frame this as permission, not a feature: they are allowed to forget where things are. That relief is the point."},

{h:"Hour 1 · C1-L1",c:"Concept",t:"2:30",html:`
<h2><span class="n">Concept 9 of 9</span>Cut, copy, paste</h2>
<div class="grid g3">
<div class="card"><h3>Copy — <span class="kbd">Ctrl</span>+<span class="kbd">C</span></h3><p>Makes a duplicate. The original stays where it is.</p></div>
<div class="card"><h3>Cut — <span class="kbd">Ctrl</span>+<span class="kbd">X</span></h3><p>Picks it up to move it. The original goes away once you paste.</p></div>
<div class="card"><h3>Paste — <span class="kbd">Ctrl</span>+<span class="kbd">V</span></h3><p>Puts it down wherever your cursor is.</p></div>
</div>
<div class="callout"><span class="tag">Note</span><p>Copying looks like nothing happened. That is normal — the text is being held invisibly until you paste it.</p></div>`,
n:"Name the invisible-clipboard confusion out loud. Beginners often copy twice because they saw no feedback."},

{h:"Hour 1 · C1-L1",c:"Demonstration",t:"3:00",html:`
<h2><span class="n">Watch first</span>Everything at once, in 90 seconds</h2>
<ol class="steps">
<li>Click the search box. Type <b>notepad</b>. Press <span class="kbd">Enter</span>.</li>
<li>Type your first and last name. Use <span class="kbd">Shift</span> for the capitals.</li>
<li>Press <span class="kbd">Enter</span> for a new line. Type your phone number.</li>
<li>Press <span class="kbd">Ctrl</span>+<span class="kbd">A</span> to select everything, then <span class="kbd">Ctrl</span>+<span class="kbd">C</span> to copy it.</li>
<li>Press <span class="kbd">Ctrl</span>+<span class="kbd">S</span>. Choose <b>Documents</b>. Name it <b>My Info</b>. Click <b>Save</b>.</li>
</ol>
<div class="callout"><span class="tag">Important</span><p>Watch me do it once all the way through. Do not follow along yet — you will do it yourself in a moment.</p></div>`,
n:"Do it on the projector at real speed, then again narrating each keystroke. Insist they watch the first pass with hands off keyboards."},

{h:"Hour 1 · C1-L1",c:"Lab launch",t:"12:00",html:`
<h2><span class="n">Lab 1 · 12 minutes</span>My Contact Card</h2>
<p class="lead">Every form asks for the same details. Type them once today, paste them forever.</p>
<div class="grid g2" style="margin-top:1em">
<div class="card"><h3>You will produce</h3><p>A file named <b>My Info.txt</b>, saved in Documents, containing your name, phone, email, and address.</p></div>
<div class="card"><h3>Done when</h3><p>You close Notepad, reopen it from Documents, and your details are still there.</p></div>
</div>
<div class="callout"><span class="tag">Tip</span><p>No touchpad? Every step works from the keyboard: <span class="kbd">⊞</span> to search, <span class="kbd">Tab</span> to move between buttons, <span class="kbd">Enter</span> to press one.</p></div>`,
n:"Circulate immediately — do not stand at the front. Watch for two failure points: saving to the wrong folder, and typing into the file-name box before choosing the folder."},

{h:"Hour 1 · C1-L1",c:"Checkpoint",t:"1:30",html:`
<h2><span class="n">Checkpoint</span>Three questions</h2>
<div class="qa"><div class="q">1. You want to see the extra options for a file. Which tap?</div></div>
<div class="qa"><div class="q">2. You just deleted a paragraph by accident. What do you press?</div></div>
<div class="qa"><div class="q">3. Where do you go when you cannot remember where a program lives?</div></div>`,
n:"Ask for hands, not shouted answers. Give them fifteen seconds of quiet to think first."},

{h:"Hour 1 · C1-L1",c:"Checkpoint",t:"1:30",html:`
<h2><span class="n">Checkpoint</span>Answers</h2>
<div class="qa"><div class="q">1. You want to see the extra options for a file.</div><div class="a">Two-finger tap. One finger does it; two fingers ask what else.</div></div>
<div class="qa"><div class="q">2. You just deleted a paragraph by accident.</div><div class="a">Ctrl + Z. Press it again to go back further.</div></div>
<div class="qa"><div class="q">3. You cannot remember where a program lives.</div><div class="a">The search box, bottom left. Type a few letters of the name.</div></div>`,
n:"If more than two people miss question 1, re-demo the two-finger tap before you break. It underpins the rest of the day."},

{h:"Hour 1 · C1-L1",c:"Summary",t:"1:00",html:`
<h2><span class="n">Hour 1 complete</span>What you can now do</h2>
<ul>
<li>Name the four groups of parts inside your laptop</li>
<li>Hover, tap, double-tap, two-finger tap, and drag</li>
<li>Use <span class="kbd">Esc</span>, <span class="kbd">⊞</span>, <span class="kbd">Shift</span>, <span class="kbd">Ctrl</span>, <span class="kbd">Alt</span>, <span class="kbd">Enter</span>, <span class="kbd">Backspace</span>, <span class="kbd">Delete</span></li>
<li>Find any program by typing its name</li>
<li>Copy in one place and paste in another</li>
<li>Save a file you can find again</li>
</ul>
<div class="callout"><span class="tag">Next</span><p>Ten-minute break. Then Hour 2 — where that file actually lives, and how to build somewhere to keep it.</p></div>`,
n:"Say the break end time out loud and write it on the board. 11:50 out, 12:00 back."},

/* ===================== HOUR 2 : C1-L2 ===================== */
{h:"Hour 2 · C1-L2",c:"Module cover",t:"40 min",html:`
<div class="cover">
  <div class="eyebrow">Hour 2 · Module C1-L2</div>
  <h1>Windows<br>Fundamentals</h1>
  <div class="meta">
    <b>Teach</b> 25 min &nbsp;·&nbsp; <b>Hands-on</b> 12 min &nbsp;·&nbsp; <b>Checkpoint</b> 3 min<br>
    <b>You will build</b> &nbsp;A filing system that holds your contact card
  </div>
</div>`,
n:"Start 12:00. Lab launch by 12:25. Lunch at 12:40 — protect that, people get restless."},

{h:"Hour 2 · C1-L2",c:"Why this matters",t:"1:30",html:`
<h2><span class="n">Why this matters</span>Where did my file go?</h2>
<p class="lead">You saved something last hour. In three weeks you will want it back. This hour is about never losing it.</p>
<div class="obj"><span class="tag">By the end of this hour you can</span>
<ul>
<li>Explain what an operating system does</li>
<li>Locate the desktop, taskbar, and Start menu</li>
<li>Open a program three different ways</li>
<li>Create folders and move files into them</li>
<li>Choose correctly between Sleep, Restart, and Shut down</li>
</ul></div>`,
n:"Open with the question, not the definition. 'Where did my file go' is the anxiety they actually have."},

{h:"Hour 2 · C1-L2",c:"Recall",t:"1:00",html:`
<h2><span class="n">Building on Hour 1</span>You already saved a file</h2>
<p class="lead">You typed your details, pressed <span class="kbd">Ctrl</span>+<span class="kbd">S</span>, and chose Documents.</p>
<p style="margin-top:1em">Documents is a folder. Folders live inside a filing system. That filing system is run by the operating system — which is what we are about to meet.</p>
<div class="callout"><span class="tag">Note</span><p>Everything this hour is a zoom-out from a thing you already did.</p></div>`,
n:"Literal callback to Lab 1. Continuity is what makes four hours feel like one course instead of four lectures."},

{h:"Hour 2 · C1-L2",c:"Concept",t:"2:00",html:`
<h2><span class="n">Concept 1 of 10</span>What an operating system is</h2>
<p class="lead">The program that runs all the other programs.</p>
<p style="margin-top:.8em">It starts when you press the power button. It draws what you see. It remembers where your files are. It lets your keyboard talk to your screen.</p>
<div class="callout"><span class="tag">Note</span><p>Without it, the laptop powers on and does nothing at all — like a car with a full tank and no engine.</p></div>`,
n:"Ninety seconds. Do not get pulled into a hardware-versus-software discussion."},

{h:"Hour 2 · C1-L2",c:"Concept",t:"1:30",html:`
<h2><span class="n">Concept 2 of 10</span>You have met these before</h2>
<div class="grid g4">
<div class="card"><h3>Windows</h3><p>Most laptops and desktops. What is on the machine in front of you.</p></div>
<div class="card plain"><h3>macOS</h3><p>Apple computers.</p></div>
<div class="card plain"><h3>Linux</h3><p>Free and open. Popular with technicians.</p></div>
<div class="card plain"><h3>Android / iOS</h3><p>Your phone runs one of these.</p></div>
</div>
<p style="margin-top:1.2em">Yours is <b>Windows 11</b>. Everything today is Windows 11.</p>`,
n:"Thirty seconds of context, then move. Somebody always asks about Mac — answer briefly and keep going."},

{h:"Hour 2 · C1-L2",c:"Concept",t:"1:30",html:`
<h2><span class="n">Concept 3 of 10</span>The desktop is home base</h2>
<p class="lead">The screen you land on after signing in.</p>
<div class="grid g3" style="margin-top:1em">
<div class="card"><h3>Icons</h3><p>Small pictures. Each opens a program, file, or folder.</p></div>
<div class="card"><h3>Background</h3><p>The picture behind everything. Yours to change.</p></div>
<div class="card"><h3>Taskbar</h3><p>The strip along the bottom. Always there.</p></div>
</div>
<div class="callout"><span class="tag">Tip</span><p>Lost in a pile of open windows? Press <span class="kbd">⊞</span>+<span class="kbd">D</span> to jump straight back to the desktop.</p></div>`,
n:"Have them press Windows+D. Instant, visible, and it always gets a reaction."},

{h:"Hour 2 · C1-L2",c:"Concept",t:"2:00",html:`
<h2><span class="n">Concept 4 of 10</span>The taskbar</h2>
<div class="grid g2">
<div class="card"><h3>Start button</h3><p>The window logo. Opens the Start menu.</p></div>
<div class="card"><h3>Search box</h3><p>Right beside Start. Type anything.</p></div>
<div class="card"><h3>Pinned programs</h3><p>Your regulars, one click away.</p></div>
<div class="card"><h3>Clock and notifications</h3><p>Far right. Time, date, Wi-Fi, battery, volume.</p></div>
</div>
<div class="callout"><span class="tag">Tip</span><p>A program that is running shows a small line under its icon. That is how you tell open from merely pinned.</p></div>`,
n:"Point out the underline on the projector. It answers 'is it open or not' — a question beginners ask constantly."},

{h:"Hour 2 · C1-L2",c:"Concept",t:"1:30",html:`
<h2><span class="n">Concept 5 of 10</span>The Start menu</h2>
<p class="lead">Press <span class="kbd">⊞</span> or click the window logo.</p>
<div class="grid g3" style="margin-top:1em">
<div class="card"><h3>Pinned</h3><p>Apps put up front for quick reach.</p></div>
<div class="card"><h3>All apps</h3><p>Everything installed, in alphabetical order.</p></div>
<div class="card"><h3>Your account and power</h3><p>Bottom corners. Sign out, lock, sleep, shut down.</p></div>
</div>`,
n:"Open it live and leave it on screen while you talk through the three zones."},

{h:"Hour 2 · C1-L2",c:"Concept",t:"2:00",html:`
<h2><span class="n">Concept 6 of 10</span>Three ways to open a program</h2>
<ol class="steps">
<li><b>Click its taskbar icon.</b> Fastest, if it is pinned there.</li>
<li><b>Open Start and find it in All apps.</b> Best when you are browsing rather than looking.</li>
<li><b>Search its name.</b> Best when you know what you want. Usually the fastest of all.</li>
</ol>
<div class="callout"><span class="tag">Tip</span><p>Pick whichever feels natural. There is no wrong one — they all end in the same place.</p></div>`,
n:"Say the no-wrong-answer line explicitly. Beginners assume there is a correct method and freeze looking for it."},

{h:"Hour 2 · C1-L2",c:"Concept",t:"2:00",html:`
<h2><span class="n">Concept 7 of 10</span>File Explorer — where your files really are</h2>
<p class="lead">The yellow folder on the taskbar. Or press <span class="kbd">⊞</span>+<span class="kbd">E</span>.</p>
<div class="grid g3" style="margin-top:1em">
<div class="card"><h3>Documents</h3><p>Where <b>My Info.txt</b> went last hour.</p></div>
<div class="card"><h3>Downloads</h3><p>Where anything you get from the internet lands.</p></div>
<div class="card"><h3>Pictures</h3><p>Photos and images.</p></div>
</div>
<div class="callout"><span class="tag">Tip</span><p>Left side is the map. Right side is what is inside. Click on the left, look on the right.</p></div>`,
n:"Open File Explorer and show them My Info.txt sitting in Documents. Making Lab 1's output visible here lands the whole idea of a filing system."},

{h:"Hour 2 · C1-L2",c:"Concept",t:"2:00",html:`
<h2><span class="n">Concept 8 of 10</span>Folders are drawers</h2>
<p class="lead">A folder holds files. A folder can hold other folders.</p>
<ol class="steps">
<li>Two-finger tap on empty space inside a folder or on the desktop.</li>
<li>Choose <b>New</b>, then <b>Folder</b>.</li>
<li>Type the name while it is highlighted, then press <span class="kbd">Enter</span>.</li>
</ol>
<div class="callout"><span class="tag">Tip</span><p>Name folders the way you would label a drawer at home: <b>Jobs</b>, <b>Health</b>, <b>Taxes</b>. Not <b>New Folder (3)</b>.</p></div>`,
n:"The naming advice matters more than the mechanics. Bad names are why people cannot find their own files later."},

{h:"Hour 2 · C1-L2",c:"Concept",t:"2:00",html:`
<h2><span class="n">Concept 9 of 10</span>Moving files is the same three keys</h2>
<table>
<tr><th></th><th>With text</th><th>With files</th></tr>
<tr><td><span class="kbd">Ctrl</span>+<span class="kbd">C</span></td><td>Copies the words</td><td>Copies the file — you end up with two</td></tr>
<tr><td><span class="kbd">Ctrl</span>+<span class="kbd">X</span></td><td>Cuts the words</td><td>Picks the file up to move it</td></tr>
<tr><td><span class="kbd">Ctrl</span>+<span class="kbd">V</span></td><td>Pastes the words</td><td>Drops the file in this folder</td></tr>
</table>
<div class="callout"><span class="tag">Note</span><p>You learned these for text last hour. They work identically on files. That is the whole lesson.</p></div>`,
n:"This is the payoff slide for Hour 1. Land it — one set of keys, two uses, no new learning."},

{h:"Hour 2 · C1-L2",c:"Concept",t:"2:30",html:`
<h2><span class="n">Concept 10 of 10</span>Sleep, Restart, or Shut down?</h2>
<div class="grid g3">
<div class="card"><h3>Sleep</h3><p>Short breaks. Everything stays open and comes back instantly. Use this at lunch today.</p></div>
<div class="card"><h3>Restart</h3><p>Off and back on by itself. Use it for updates, or when something is misbehaving.</p></div>
<div class="card"><h3>Shut down</h3><p>Fully off. Use it at the end of the day. We will do this together at 2:52.</p></div>
</div>
<div class="callout caution"><span class="tag">Caution</span><p>Never close the lid on unsaved work and assume it is safe. Save first — <span class="kbd">Ctrl</span>+<span class="kbd">S</span> — then choose Sleep.</p></div>`,
n:"Tell them now that lunch is a Sleep, not a Shut down. It saves you ten minutes of boot time at 13:10."},

{h:"Hour 2 · C1-L2",c:"Demonstration",t:"2:30",html:`
<h2><span class="n">Watch first</span>Build a drawer and put something in it</h2>
<ol class="steps">
<li>Press <span class="kbd">⊞</span>+<span class="kbd">E</span> to open File Explorer. Click <b>Documents</b>.</li>
<li>Two-finger tap on empty space. Choose <b>New</b>, then <b>Folder</b>. Name it <b>My Files</b>.</li>
<li>Click <b>My Info.txt</b> once, then press <span class="kbd">Ctrl</span>+<span class="kbd">X</span>.</li>
<li>Double-tap <b>My Files</b> to go inside, then press <span class="kbd">Ctrl</span>+<span class="kbd">V</span>.</li>
<li>Search <b>My Info</b> in the taskbar to prove Windows can still find it.</li>
</ol>`,
n:"Deliberately search for the file after moving it. Watching Windows find it instantly is what makes moving files feel safe."},

{h:"Hour 2 · C1-L2",c:"Lab launch",t:"12:00",html:`
<h2><span class="n">Lab 2 · 12 minutes</span>Build Your Filing Cabinet</h2>
<p class="lead">Right now everything is one pile. Give it drawers.</p>
<div class="grid g2" style="margin-top:1em">
<div class="card"><h3>You will produce</h3><p>Inside Documents: a folder <b>My Files</b> holding three folders — <b>Personal</b>, <b>Jobs</b>, <b>Health</b> — with your contact card inside Personal.</p></div>
<div class="card"><h3>Done when</h3><p>You search <b>My Info</b>, open the result, and it is sitting in Personal.</p></div>
</div>
<div class="callout"><span class="tag">Tip</span><p>Finished early? Pin File Explorer to your taskbar: two-finger tap its icon, choose <b>Pin to taskbar</b>.</p></div>`,
n:"Watch for people creating the three folders beside My Files rather than inside it. Easiest fix is to drag them in."},

{h:"Hour 2 · C1-L2",c:"Checkpoint",t:"1:30",html:`
<h2><span class="n">Checkpoint</span>Three questions</h2>
<div class="qa"><div class="q">1. You are stepping out for thirty minutes and want your work exactly as you left it. Which power option?</div></div>
<div class="qa"><div class="q">2. What are the two keys that open File Explorer?</div></div>
<div class="qa"><div class="q">3. You want to move a file, not duplicate it. Cut or copy?</div></div>`,
n:"Question 1 is the one that matters today — they are about to go to lunch."},

{h:"Hour 2 · C1-L2",c:"Checkpoint",t:"1:30",html:`
<h2><span class="n">Checkpoint</span>Answers</h2>
<div class="qa"><div class="q">1. Stepping out for thirty minutes.</div><div class="a">Sleep. Everything stays open and returns instantly.</div></div>
<div class="qa"><div class="q">2. Two keys for File Explorer.</div><div class="a">Windows key + E.</div></div>
<div class="qa"><div class="q">3. Move, not duplicate.</div><div class="a">Cut — Ctrl + X. Copy would leave you with two.</div></div>`,
n:"Then send them to lunch: laptops to Sleep, back at 13:10."},

{h:"Hour 2 · C1-L2",c:"Summary",t:"1:00",html:`
<h2><span class="n">Hour 2 complete</span>What you can now do</h2>
<ul>
<li>Say what an operating system does</li>
<li>Find the desktop, taskbar, Start menu, and search box</li>
<li>Open a program three different ways</li>
<li>Create folders and name them usefully</li>
<li>Move files with cut and paste</li>
<li>Choose correctly between Sleep, Restart, and Shut down</li>
</ul>
<div class="callout"><span class="tag">Next</span><p>Lunch — thirty minutes. Put your laptop to <b>Sleep</b>, not Shut down. Back at 13:10 for the internet.</p></div>`,
n:"Write 13:10 on the board. Say it twice. Lunch is the segment most likely to run long."},
/* ===================== HOUR 3 : C2-L1 ===================== */
{h:"Hour 3 · C2-L1",c:"Module cover",t:"40 min",html:`
<div class="cover">
  <div class="eyebrow">Hour 3 · Module C2-L1</div>
  <h1>Internet<br>Fundamentals</h1>
  <div class="meta">
    <b>Teach</b> 25 min &nbsp;·&nbsp; <b>Hands-on</b> 12 min &nbsp;·&nbsp; <b>Checkpoint</b> 3 min<br>
    <b>You will build</b> &nbsp;A bookmarks bar of sites you actually use
  </div>
</div>`,
n:"Start 13:10. People are post-lunch and slow — open with the address bar demo rather than a definition."},

{h:"Hour 3 · C2-L1",c:"Why this matters",t:"1:30",html:`
<h2><span class="n">Why this matters</span>Typing the same address every time</h2>
<p class="lead">Most people search for a site they visit weekly, then click the third result and hope. There is a faster, safer way.</p>
<div class="obj"><span class="tag">By the end of this hour you can</span>
<ul>
<li>Tell the address bar apart from the search box</li>
<li>Read a web address and know who you are talking to</li>
<li>Use tabs to hold several pages at once</li>
<li>Save a site so you never type it again</li>
<li>Search deliberately instead of hopefully</li>
</ul></div>`,
n:"The address-bar-versus-search-box confusion is the biggest practical win of this hour. Flag it early."},

{h:"Hour 3 · C2-L1",c:"Recall",t:"1:00",html:`
<h2><span class="n">Building on Hours 1 and 2</span>Same skills, new window</h2>
<div class="grid g3">
<div class="card"><h3>Tap and double-tap</h3><p>Clicking links works the same way.</p></div>
<div class="card"><h3>Search by typing</h3><p>You did this in Windows. You are about to do it on the whole internet.</p></div>
<div class="card"><h3>Copy and paste</h3><p><span class="kbd">Ctrl</span>+<span class="kbd">C</span> and <span class="kbd">Ctrl</span>+<span class="kbd">V</span> work on web pages too.</p></div>
</div>`,
n:"Thirty seconds. Reassurance, not instruction."},

{h:"Hour 3 · C2-L1",c:"Concept",t:"1:30",html:`
<h2><span class="n">Concept 1 of 11</span>What the internet actually is</h2>
<p class="lead">Millions of computers, connected, agreeing to pass messages to each other.</p>
<p style="margin-top:.8em">Your laptop asks another computer for a page. That computer sends it back. That is the whole thing.</p>
<div class="callout"><span class="tag">Note</span><p>Your Wi-Fi connects you to that network. The browser is what turns the reply into something you can read.</p></div>`,
n:"Keep it to sixty seconds. There is no exam on this — it is scaffolding for the browser."},

{h:"Hour 3 · C2-L1",c:"Concept",t:"1:30",html:`
<h2><span class="n">Concept 2 of 11</span>The browser is your window</h2>
<p class="lead">A program whose only job is to show you web pages.</p>
<div class="grid g3" style="margin-top:1em">
<div class="card"><h3>Edge</h3><p>Built into Windows. Already on your laptop.</p></div>
<div class="card plain"><h3>Chrome</h3><p>Google's. The most widely used.</p></div>
<div class="card plain"><h3>Firefox</h3><p>Independent. Strong on privacy.</p></div>
</div>
<p style="margin-top:1.2em">They all do the same job. Use whichever is on your taskbar.</p>`,
n:"Do not run a browser-preference debate. Point at the taskbar and move."},

{h:"Hour 3 · C2-L1",c:"Concept",t:"2:00",html:`
<h2><span class="n">Concept 3 of 11</span>Five controls that run the browser</h2>
<div class="grid g2">
<div class="card"><h3>Back and Forward</h3><p>The arrows, top left. Back is the most useful button on the internet.</p></div>
<div class="card"><h3>Refresh</h3><p>The circular arrow. Reloads the page when it looks stuck or stale.</p></div>
<div class="card"><h3>Address bar</h3><p>The long box across the top. Where the page's address lives.</p></div>
<div class="card"><h3>Tabs and the star</h3><p>Tabs sit above the address bar. The star saves the page.</p></div>
</div>`,
n:"Have them press Back a few times on a live page. It defuses the fear of clicking the wrong link permanently."},

{h:"Hour 3 · C2-L1",c:"Concept",t:"2:30",html:`
<h2><span class="n">Concept 4 of 11</span>Address bar or search box?</h2>
<div class="grid g2">
<div class="card"><h3>Address bar — you know where you are going</h3><p>Type <b>ssa.gov</b> and press <span class="kbd">Enter</span>. You arrive at Social Security. No guessing, no results page, nobody in between.</p></div>
<div class="card"><h3>Search box — you are looking for something</h3><p>Type <b>how do I replace my social security card</b>. You get a page of possibilities to choose from.</p></div>
</div>
<div class="callout"><span class="tag">Important</span><p>If you already know the site, type it in the address bar. Searching for a site you know is how people end up on fake look-alikes.</p></div>
<p style="margin-top:.9em">You do not need <b>www.</b> or <b>https://</b> — the browser fills those in.</p>`,
n:"This is the single most valuable slide of the hour. Type ssa.gov live, then search for it and show the ads sitting above the real result."},

{h:"Hour 3 · C2-L1",c:"Concept",t:"2:00",html:`
<h2><span class="n">Concept 5 of 11</span>Reading a web address</h2>
<p class="lead" style="font-family:var(--mono);color:var(--lime);font-size:clamp(1.1rem,2.4vw,2rem)">www.<b style="color:var(--paper)">techexchange</b>.org/digitalliteracy</p>
<div class="grid g3" style="margin-top:1.2em">
<div class="card"><h3>The name</h3><p><b>techexchange</b> — who you are actually talking to. The part that matters.</p></div>
<div class="card"><h3>The ending</h3><p><b>.org</b> nonprofit · <b>.gov</b> government · <b>.com</b> business · <b>.edu</b> school</p></div>
<div class="card"><h3>The rest</h3><p><b>/digitalliteracy</b> — which page on that site. Harmless.</p></div>
</div>
<div class="callout"><span class="tag">Tip</span><p>Read the address from the left, and stop at the first single slash. Everything before it is who you are dealing with.</p></div>`,
n:"Plant this carefully — Hour 4's scam recognition is built entirely on it. Say 'stop at the first slash' twice."},

{h:"Hour 3 · C2-L1",c:"Concept",t:"1:30",html:`
<h2><span class="n">Concept 6 of 11</span>Links</h2>
<p class="lead">Text or pictures you can click to go somewhere else.</p>
<div class="grid g3" style="margin-top:1em">
<div class="card"><h3>How to spot one</h3><p>Often blue and underlined. Always: the arrow turns into a pointing hand.</p></div>
<div class="card"><h3>Check before you click</h3><p>Hover without clicking. The real destination appears in the bottom-left corner.</p></div>
<div class="card"><h3>If it goes wrong</h3><p>Press Back.</p></div>
</div>
<div class="callout"><span class="tag">Important</span><p>Hovering to preview a link costs one second and prevents most bad clicks. Build the habit today.</p></div>`,
n:"Demo the hover preview on the projector. Most people have never noticed the status bar in the corner."},

{h:"Hour 3 · C2-L1",c:"Concept",t:"1:30",html:`
<h2><span class="n">Concept 7 of 11</span>Tabs</h2>
<p class="lead">Several pages open at once in one window — like keeping a finger in three books.</p>
<div class="grid g3" style="margin-top:1em">
<div class="card"><h3>New tab</h3><p>Click the <b>+</b>, or press <span class="kbd">Ctrl</span>+<span class="kbd">T</span></p></div>
<div class="card"><h3>Switch</h3><p>Click the tab you want</p></div>
<div class="card"><h3>Close</h3><p>Click its <b>×</b>, or press <span class="kbd">Ctrl</span>+<span class="kbd">W</span></p></div>
</div>
<div class="callout"><span class="tag">Tip</span><p>Closed one by accident? <span class="kbd">Ctrl</span>+<span class="kbd">Shift</span>+<span class="kbd">T</span> brings it straight back.</p></div>`,
n:"The reopen-closed-tab shortcut always gets a reaction. Worth the ten seconds."},

{h:"Hour 3 · C2-L1",c:"Concept",t:"2:00",html:`
<h2><span class="n">Concept 8 of 11</span>Bookmarks — type it once, ever</h2>
<ol class="steps">
<li>Go to the site.</li>
<li>Click the <b>star</b> at the right end of the address bar, or press <span class="kbd">Ctrl</span>+<span class="kbd">D</span>.</li>
<li>Give it a short name you will recognise. Choose a folder. Click <b>Done</b>.</li>
</ol>
<div class="callout"><span class="tag">Tip</span><p>Turn on the bookmarks bar and your saved sites sit under the address bar permanently — one click, no typing, and no chance of a fake look-alike.</p></div>`,
n:"Frame bookmarks as a safety feature, not just convenience. A bookmarked bank is a bank you cannot be phished into mistyping."},

{h:"Hour 3 · C2-L1",c:"Concept",t:"2:00",html:`
<h2><span class="n">Concept 9 of 11</span>Searching on purpose</h2>
<div class="grid g2">
<div class="card"><h3>Be specific</h3><p><b>bus schedule</b> is weak. <b>AC Transit 51B schedule Oakland</b> is strong.</p></div>
<div class="card"><h3>Use quotation marks</h3><p><b>"digital literacy classes Oakland"</b> finds that exact phrase.</p></div>
<div class="card"><h3>Remove a word</h3><p>Put a minus in front: <b>jaguar -car</b> gets you the animal.</p></div>
<div class="card"><h3>Add the place</h3><p>Ending a search with <b>Oakland</b> or <b>near me</b> changes everything.</p></div>
</div>`,
n:"Use a real local example the room will recognise. Specificity is the skill; the operators are garnish."},

{h:"Hour 3 · C2-L1",c:"Concept",t:"2:00",html:`
<h2><span class="n">Concept 10 of 11</span>Reading a results page</h2>
<ol class="steps">
<li><b>Sponsored</b> or <b>Ad</b> at the top — someone paid to be there. Not the best answer, just the paid one.</li>
<li>Real results below. Read the green or grey web address before you click.</li>
<li>For anything official — benefits, taxes, licences — look for <b>.gov</b>.</li>
</ol>
<div class="callout caution"><span class="tag">Caution</span><p>Scam sites buy ads too. A result at the very top of the page has been paid for, not vetted.</p></div>`,
n:"Search for a government service live and show the sponsored results above the real .gov site. It lands harder than any slide."},

{h:"Hour 3 · C2-L1",c:"Concept",t:"2:30",html:`
<h2><span class="n">Concept 11 of 11</span>AI assistants</h2>
<p class="lead">ChatGPT, Gemini, Claude, and Perplexity answer in sentences instead of handing you a list of links.</p>
<div class="grid g2" style="margin-top:1em">
<div class="card"><h3>Good for</h3><p>Explaining something confusing in plain words. Drafting a letter or an email. Summarising something long.</p></div>
<div class="card"><h3>Check before you trust</h3><p>Names, dates, prices, phone numbers, medical and legal advice. AI states wrong things in a confident voice.</p></div>
</div>
<div class="callout"><span class="tag">Important</span><p>Use AI to understand. Use a search engine — and the real <b>.gov</b> or <b>.org</b> site — to confirm.</p></div>`,
n:"Perplexity needs no account, so it is the easiest live demo. Ask it something local and show the citations underneath."},

{h:"Hour 3 · C2-L1",c:"Demonstration",t:"2:30",html:`
<h2><span class="n">Watch first</span>Same question, two tools</h2>
<ol class="steps">
<li>Open a new tab. In the address bar type <b>google.com</b>, press <span class="kbd">Enter</span>.</li>
<li>Search <b>how do I renew a California ID</b>. Note the ads on top and the <b>dmv.ca.gov</b> result below.</li>
<li>New tab. Address bar: <b>perplexity.ai</b>. Ask the same question.</li>
<li>Compare: one hands you links to judge, the other hands you an answer with its sources listed.</li>
<li>Bookmark <b>dmv.ca.gov</b> with <span class="kbd">Ctrl</span>+<span class="kbd">D</span>.</li>
</ol>`,
n:"End the demo on the bookmark. It is the bridge straight into the lab."},

{h:"Hour 3 · C2-L1",c:"Lab launch",t:"12:00",html:`
<h2><span class="n">Lab 3 · 12 minutes</span>Your Own Bookmarks Bar</h2>
<p class="lead">Three sites you personally need, saved for good.</p>
<div class="grid g2" style="margin-top:1em">
<div class="card"><h3>You will produce</h3><p>A bookmarks folder named <b>My Sites</b> holding three real sites — your bank, benefits portal, transit, library, church, employer. Your choice.</p></div>
<div class="card"><h3>Done when</h3><p>You close the browser, reopen it, and reach all three in one click each.</p></div>
</div>
<div class="callout"><span class="tag">Tip</span><p>Type each address in the address bar rather than searching for it. That is the safe habit we are building.</p></div>`,
n:"Circulate with suggestions ready — some people freeze on 'which three sites'. Offer: bank, AC Transit, Oakland Public Library."},

{h:"Hour 3 · C2-L1",c:"Checkpoint",t:"1:30",html:`
<h2><span class="n">Checkpoint</span>Three questions</h2>
<div class="qa"><div class="q">1. You visit your bank's site every week. Address bar or search box?</div></div>
<div class="qa"><div class="q">2. In <b>www.oaklandca.gov/services</b>, which part tells you who you are dealing with?</div></div>
<div class="qa"><div class="q">3. The first result says <b>Sponsored</b>. What does that mean?</div></div>`,
n:"Question 2 is the one to slow down on. It is the foundation of the next hour."},

{h:"Hour 3 · C2-L1",c:"Checkpoint",t:"1:30",html:`
<h2><span class="n">Checkpoint</span>Answers</h2>
<div class="qa"><div class="q">1. A site you visit weekly.</div><div class="a">Address bar — or better, your bookmark. Never search for a site you already know.</div></div>
<div class="qa"><div class="q">2. Who you are dealing with.</div><div class="a">oaklandca.gov — read from the left, stop at the first slash.</div></div>
<div class="qa"><div class="q">3. Sponsored.</div><div class="a">Somebody paid for that position. It was not chosen for being the best answer.</div></div>`,
n:"Then break: 13:50 out, 14:00 back. Last stretch of the day."},

{h:"Hour 3 · C2-L1",c:"Summary",t:"1:00",html:`
<h2><span class="n">Hour 3 complete</span>What you can now do</h2>
<ul>
<li>Use the address bar to go somewhere directly</li>
<li>Read a web address and identify who owns it</li>
<li>Open, switch, close, and reopen tabs</li>
<li>Save a site as a bookmark and organise it in a folder</li>
<li>Search specifically, and tell ads from real results</li>
<li>Use an AI assistant and know what to verify</li>
</ul>
<div class="callout"><span class="tag">Next</span><p>Ten-minute break. Then the last hour — how to stay safe with everything you just learned.</p></div>`,
n:"14:00 on the board."},

/* ===================== HOUR 4 : C2-L2 ===================== */
{h:"Hour 4 · C2-L2",c:"Module cover",t:"40 min",html:`
<div class="cover">
  <div class="eyebrow">Hour 4 · Module C2-L2</div>
  <h1>Staying Safe<br>Online</h1>
  <div class="meta">
    <b>Teach</b> 25 min &nbsp;·&nbsp; <b>Hands-on</b> 12 min &nbsp;·&nbsp; <b>Checkpoint</b> 3 min<br>
    <b>You will build</b> &nbsp;A passphrase you can remember and nobody can guess
  </div>
</div>`,
n:"Start 14:00. Energy is lowest here — the scam drill in the middle is what carries the hour."},

{h:"Hour 4 · C2-L2",c:"Why this matters",t:"1:30",html:`
<h2><span class="n">Why this matters</span>Two habits stop most of it</h2>
<p class="lead">You do not need to become a security expert. Almost everything that goes wrong is stopped by two habits and one pause.</p>
<div class="obj"><span class="tag">By the end of this hour you can</span>
<ul>
<li>Read a web address and spot a fake</li>
<li>Build a passphrase that is strong and memorable</li>
<li>Explain what two-step sign-in is and why email comes first</li>
<li>Name the warning signs in a scam text or call</li>
<li>Find the security tools already on your laptop</li>
</ul></div>`,
n:"Set the tone: this is not about fear. Frame it as a small number of habits, repeated."},

{h:"Hour 4 · C2-L2",c:"Recall",t:"1:00",html:`
<h2><span class="n">Building on Hour 3</span>You already learned the main defence</h2>
<p class="lead" style="font-family:var(--mono);color:var(--lime);font-size:clamp(1.1rem,2.2vw,1.8rem)">Read from the left. Stop at the first slash.</p>
<p style="margin-top:1.2em">That one habit catches most fake websites before they can do anything. Everything else this hour is added on top of it.</p>`,
n:"Say the rule and have the room say it back. It is the hour's spine."},

{h:"Hour 4 · C2-L2",c:"Concept",t:"1:30",html:`
<h2><span class="n">Concept 1 of 11</span>Security in plain English</h2>
<p class="lead">Keeping your accounts private, your laptop healthy, and your money where it belongs.</p>
<div class="grid g4" style="margin-top:1em">
<div class="card"><h3>Updates on</h3><p>Let the laptop fix itself.</p></div>
<div class="card"><h3>Pause before clicking</h3><p>One second of checking.</p></div>
<div class="card"><h3>Strong, separate sign-ins</h3><p>Different password per account.</p></div>
<div class="card"><h3>A copy of what matters</h3><p>Photos and documents backed up.</p></div>
</div>
<div class="callout"><span class="tag">Note</span><p>Small habits, repeated. Not perfection.</p></div>`,
n:"Emphasise habits over perfection. Perfection makes people give up entirely."},

{h:"Hour 4 · C2-L2",c:"Concept",t:"2:30",html:`
<h2><span class="n">Concept 2 of 11</span>Spotting a fake address</h2>
<div class="grid g2">
<div class="card"><h3 style="color:var(--lime)">Real</h3><p style="font-family:var(--mono)">chase.com/login<br>ssa.gov<br>oaklandca.gov</p></div>
<div class="card" style="border-left-color:var(--flag)"><h3 style="color:var(--flag)">Fake</h3><p style="font-family:var(--mono)">chase-secure-login.com<br>ssa.gov.account-verify.net<br>0aklandca.gov</p></div>
</div>
<div class="callout caution"><span class="tag">Caution</span><p>Scammers add real words like <b>secure</b>, <b>login</b>, or <b>verify</b> in front of the name. The name that counts is the one right before <b>.com</b> or <b>.gov</b>.</p></div>`,
n:"Point at the zero in 0aklandca. Let them find it — do not announce it. The looking is the lesson."},

{h:"Hour 4 · C2-L2",c:"Concept",t:"1:30",html:`
<h2><span class="n">Concept 3 of 11</span>The padlock, honestly</h2>
<div class="grid g2">
<div class="card"><h3>What it means</h3><p>Your connection to that site is scrambled, so nobody in between can read it.</p></div>
<div class="card" style="border-left-color:var(--flag)"><h3>What it does not mean</h3><p>That the site is honest. Scam sites have padlocks too — they are free.</p></div>
</div>
<div class="callout"><span class="tag">Important</span><p>The padlock protects the road, not the destination. Read the name in the address bar either way.</p></div>`,
n:"Many students were taught 'look for the padlock' years ago and stopped there. Correcting it gently is worth the ninety seconds."},

{h:"Hour 4 · C2-L2",c:"Concept",t:"1:30",html:`
<h2><span class="n">Concept 4 of 11</span>When the browser blocks you</h2>
<p class="lead">A full-screen red or blue warning means Windows or your browser has recognised something dangerous.</p>
<div class="grid g2" style="margin-top:1em">
<div class="card"><h3>Do</h3><p>Close the tab. Go to the site by typing its real address, or use your bookmark.</p></div>
<div class="card" style="border-left-color:var(--flag)"><h3>Do not</h3><p>Click past the warning to continue anyway.</p></div>
</div>
<div class="callout"><span class="tag">Note</span><p>These warnings are occasionally over-cautious. They are almost never wrong in a way that hurts you.</p></div>`,
n:"Tell them the warning is on their side. People click through because it feels like an obstacle rather than a helper."},

{h:"Hour 4 · C2-L2",c:"Concept",t:"2:00",html:`
<h2><span class="n">Concept 5 of 11</span>The passphrase method</h2>
<p class="lead">Four unrelated words beat a short word with symbols jammed in.</p>
<div class="grid g2" style="margin-top:1em">
<div class="card" style="border-left-color:var(--flag)"><h3>Weak</h3><p style="font-family:var(--mono)">P@ssw0rd1<br>Oakland2026!</p><p style="margin-top:.5em">Short, common, and guessable by a machine in seconds.</p></div>
<div class="card"><h3>Strong</h3><p style="font-family:var(--mono)">purple-tractor-window-42<br>coffee-bridge-lemon-cat</p><p style="margin-top:.5em">Long, unusual, and easy for you to picture.</p></div>
</div>
<div class="callout"><span class="tag">Tip</span><p>Pick four words with no connection to each other, join them with hyphens, add a number. Picture them together — that image is your memory.</p></div>`,
n:"Build one live on the board with the room shouting words. Do not use anyone's real passphrase."},

{h:"Hour 4 · C2-L2",c:"Concept",t:"1:30",html:`
<h2><span class="n">Concept 6 of 11</span>Never reuse the important ones</h2>
<p class="lead">If one site is broken into, every account sharing that password is now open.</p>
<div class="grid g3" style="margin-top:1em">
<div class="card"><h3>1. Email first</h3><p>Whoever holds your email can reset everything else. This one is unique, no exceptions.</p></div>
<div class="card"><h3>2. Banking and benefits</h3><p>Anywhere money moves.</p></div>
<div class="card"><h3>3. Shopping</h3><p>Anywhere your card is saved.</p></div>
</div>
<div class="callout"><span class="tag">Note</span><p>A password manager remembers them all so you do not have to. We will set one up on Thursday.</p></div>`,
n:"Email-first is the key idea. Bitwarden setup does not fit today — promise it for Thursday and keep the promise."},

{h:"Hour 4 · C2-L2",c:"Concept",t:"2:00",html:`
<h2><span class="n">Concept 7 of 11</span>Two-step sign-in</h2>
<p class="lead">Your password, plus one more proof it is really you — a code, or a tap on your phone.</p>
<div class="grid g3" style="margin-top:1em">
<div class="card"><h3>Why it works</h3><p>Even with your password, a stranger cannot get in without your phone.</p></div>
<div class="card"><h3>Turn it on where?</h3><p>Email first. Then bank. Then everything else.</p></div>
<div class="card"><h3>Where to find it</h3><p>Account settings, under <b>Security</b> or <b>Sign-in</b>.</p></div>
</div>
<div class="callout caution"><span class="tag">Caution</span><p>Get a code you did not ask for? Someone has your password. Do not approve it — change that password immediately.</p></div>`,
n:"The unrequested-code warning is genuinely actionable. Repeat it in the summary."},

{h:"Hour 4 · C2-L2",c:"Concept",t:"2:30",html:`
<h2><span class="n">Concept 8 of 11</span>The four signs of a scam</h2>
<div class="grid g2">
<div class="card"><h3>1. Urgency</h3><p>Act now. Within 24 hours. Your account will be closed. Real organisations give you time.</p></div>
<div class="card"><h3>2. A threat or a prize</h3><p>Arrest, a fine, a suspension — or you have won something you never entered.</p></div>
<div class="card"><h3>3. The address is wrong</h3><p>Close to a real name but not it. Read from the left.</p></div>
<div class="card"><h3>4. An unusual way to pay</h3><p>Gift cards, wire transfer, cryptocurrency, an app. No real agency asks for these. Ever.</p></div>
</div>`,
n:"Sign 4 is the hard stop. No government agency, utility, or bank has ever asked for a gift card. Say it plainly."},

{h:"Hour 4 · C2-L2",c:"Interactive",t:"3:00",html:`
<h2><span class="n">Try it</span>Find the four red flags</h2>
<p style="margin-bottom:.9em">A text message. Tap every part that worries you.</p>
<div class="msg" id="scamMsg">
<span class="flag" data-f="1">USPS: Your package is on hold. You must confirm within 12 hours</span> or it will be
<span class="flag" data-f="2">returned and a $3.00 fee charged to your account.</span>
Update here:
<span class="flag" data-f="3">usps-delivery-confirm.info/track</span><br><br>
<span class="flag" data-f="4">Pay the fee with a gift card code to release your package immediately.</span>
</div>
<span id="drillCount">0 of 4 found</span>`,
n:"Let them work it for ninety seconds before revealing. Ask which flag they spotted first — the answer is usually the payment method, which is a good sign."},

{h:"Hour 4 · C2-L2",c:"Concept",t:"1:30",html:`
<h2><span class="n">Concept 9 of 11</span>Scam texts and scam calls</h2>
<div class="grid g2">
<div class="card"><h3>Texts</h3><p>Deliveries, tolls, banks, and "hi is this you?" from unknown numbers. Do not tap the link. Go to the real site yourself.</p></div>
<div class="card"><h3>Calls</h3><p>Anyone can fake the number that shows up. Hang up and call back on a number you looked up yourself.</p></div>
</div>
<div class="callout caution"><span class="tag">Caution</span><p>Social Security, Medicare, and the IRS do not call to threaten you with arrest. That call is a scam every single time.</p></div>`,
n:"Ask who has had one of these calls. Every hand goes up. Shared experience does more than the slide does."},

{h:"Hour 4 · C2-L2",c:"Concept",t:"1:30",html:`
<h2><span class="n">Concept 10 of 11</span>Downloads and updates</h2>
<div class="grid g2">
<div class="card"><h3>Download only from</h3><p>The Microsoft Store, or the company's own website that you reached by typing its address.</p></div>
<div class="card" style="border-left-color:var(--flag)"><h3>Never from</h3><p>A pop-up saying your computer is infected. A "download" button in an ad. An email attachment you were not expecting.</p></div>
</div>
<div class="callout"><span class="tag">Tip</span><p>Leave Windows Update on. Those updates are mostly closing security holes.</p></div>`,
n:"The fake-infection pop-up is worth describing out loud — several people in the room have clicked one."},

{h:"Hour 4 · C2-L2",c:"Concept",t:"1:30",html:`
<h2><span class="n">Concept 11 of 11</span>What is already protecting you</h2>
<p class="lead">Search <b>Windows Security</b> in the taskbar. It is already installed and already running.</p>
<div class="grid g3" style="margin-top:1em">
<div class="card"><h3>Virus protection</h3><p>Watching in the background. Run a quick scan if something feels wrong.</p></div>
<div class="card"><h3>Site and download checks</h3><p>The warnings we just talked about.</p></div>
<div class="card"><h3>Firewall</h3><p>Blocks uninvited connections. Leave it on.</p></div>
</div>
<div class="callout"><span class="tag">Important</span><p>You do not need to buy antivirus software. Anything telling you otherwise in a pop-up is the threat, not the fix.</p></div>`,
n:"This slide saves people real money. Say the last line twice."},

{h:"Hour 4 · C2-L2",c:"Demonstration",t:"2:00",html:`
<h2><span class="n">Watch first</span>Checking a link before you trust it</h2>
<ol class="steps">
<li>Copy the suspicious address — do not open it.</li>
<li>New tab. Address bar: <b>virustotal.com</b>. Press <span class="kbd">Enter</span>.</li>
<li>Choose <b>URL</b>, paste with <span class="kbd">Ctrl</span>+<span class="kbd">V</span>, press <span class="kbd">Enter</span>.</li>
<li>Read the result. Green across the board means probably fine. Any red means leave it alone.</li>
<li>Then open <b>Windows Security</b> and confirm everything shows a green check.</li>
</ol>
<div class="callout"><span class="tag">Note</span><p>A clean result is reassurance, not a guarantee. The four scam signs still apply.</p></div>`,
n:"Use the USPS address from the drill. Have it copied and ready before class — do not type it live in front of them."},

{h:"Hour 4 · C2-L2",c:"Lab launch",t:"12:00",html:`
<h2><span class="n">Lab 4 · 12 minutes</span>Lock It Down</h2>
<p class="lead">The two things that actually protect you, done before you leave.</p>
<div class="grid g2" style="margin-top:1em">
<div class="card"><h3>You will produce</h3><p>A four-word passphrase written on your paper card, one link checked through VirusTotal, and a look at Windows Security showing green.</p></div>
<div class="card"><h3>Done when</h3><p>You can say your passphrase from memory without reading it, and you know where Windows Security lives.</p></div>
</div>
<div class="callout caution"><span class="tag">Caution</span><p>Write the passphrase on the paper card you take home. Do not save it in My Info.txt, and do not put it in the file with your address and phone number.</p></div>`,
n:"Hand out the paper cards now. Watch that nobody types a passphrase into a file — stop that immediately if you see it."},

{h:"Hour 4 · C2-L2",c:"Checkpoint",t:"1:30",html:`
<h2><span class="n">Checkpoint</span>Three questions</h2>
<div class="qa"><div class="q">1. A text says your account is locked and gives a link. What do you do?</div></div>
<div class="qa"><div class="q">2. A site has a padlock. Is it safe?</div></div>
<div class="qa"><div class="q">3. Which account gets the strongest passphrase and two-step sign-in first?</div></div>`,
n:"These three are the whole hour. If they get these, they got it."},

{h:"Hour 4 · C2-L2",c:"Checkpoint",t:"1:30",html:`
<h2><span class="n">Checkpoint</span>Answers</h2>
<div class="qa"><div class="q">1. A text says your account is locked.</div><div class="a">Do not tap the link. Go to the real site yourself, or call a number you looked up.</div></div>
<div class="qa"><div class="q">2. A site has a padlock.</div><div class="a">Not necessarily. The padlock protects the road, not the destination. Read the address.</div></div>
<div class="qa"><div class="q">3. Which account first?</div><div class="a">Email. Whoever controls it can reset everything else you own.</div></div>`,
n:"Then send them to the last break: 14:40 out, 14:50 back for close-out."},

{h:"Hour 4 · C2-L2",c:"Summary",t:"1:30",html:`
<h2><span class="n">Take this home</span>Five habits</h2>
<ol class="steps">
<li>Pause before you click. Read the address from the left.</li>
<li>A different passphrase for email, bank, and shopping.</li>
<li>Two-step sign-in on email first.</li>
<li>Updates on. Downloads only from the store or the real site.</li>
<li>Gift cards are never a real way to pay a real bill.</li>
</ol>
<div class="callout"><span class="tag">Next</span><p>Ten-minute break. Then we close out — Thursday, device numbers, and shutting down properly.</p></div>`,
n:"This is the printed one-pager they take home. Point at the handout as you read it."},

/* ===================== CLOSE-OUT ===================== */
{h:"Close-out",c:"Thursday",t:"3 min",html:`
<h2><span class="n">Close-out · 3 minutes</span>Thursday, August 27</h2>
<div class="grid g2">
<div class="card"><h3>Same time, same room</h3><p>11:00 AM – 3:00 PM · 1721 Broadway · MacArthur Meeting Room. Bring this laptop and its charger.</p></div>
<div class="card"><h3>What we cover</h3><p>Email · Google Drive, Docs and Sheets · Zoom · Google Meet. You will send a real email and join a real video call.</p></div>
</div>
<div class="callout caution"><span class="tag">Important</span><p>Attendance rule: missing an entire class day means no device with this group, and the series has to be repeated. If part of a day is missed, the make-up assignment covers it by the stated deadline.</p></div>`,
n:"State the attendance rule plainly and without apology. People need to hear it once, clearly, while there is still time to plan around it."},

{h:"Close-out",c:"Device ID",t:"3 min",html:`
<h2><span class="n">Close-out</span>Write down your Device ID</h2>
<ol class="steps">
<li>Close the laptop lid and turn it over.</li>
<li>Find the <b>QR code sticker</b> on the bottom.</li>
<li>Copy the number printed beside it onto the last line of your Computer Distribution Receipt.</li>
<li>Do the same for the sticker on your power adapter.</li>
</ol>
<div class="callout"><span class="tag">Important</span><p>This number is how we match your laptop to you. Keep the paperwork — you will need it Thursday.</p></div>`,
n:"Walk the room and visually confirm each number against the sticker. Do not rely on students transcribing it correctly."},

{h:"Close-out",c:"Shut down",t:"2 min",html:`
<h2><span class="n">Close-out · 2 minutes</span>Shutting down properly</h2>
<ol class="steps">
<li>Save anything open — <span class="kbd">Ctrl</span>+<span class="kbd">S</span>.</li>
<li>Click <b>Start</b> (the window logo).</li>
<li>Click the <b>Power</b> icon.</li>
<li>Choose <b>Shut down</b>.</li>
<li>Wait for the screen to go completely black. Then close the lid.</li>
</ol>
<div class="callout caution"><span class="tag">Caution</span><p>Do not close the lid before the screen goes black, and never hold the power button to force it off unless the laptop has stopped responding entirely.</p></div>`,
n:"Do it on the projector, then have the whole room do it together and wait for the black screens before anyone closes a lid."},

/* ---------- render ---------- */
const wrap = document.getElementById('slides');
DECK.forEach((s,i)=>{
  const d=document.createElement('section');
  d.className='slide'; d.id='s'+i;
  d.setAttribute('role','group');
  d.setAttribute('aria-label','Slide '+(i+1)+' of '+DECK.length);
  d.innerHTML=s.html;
  wrap.appendChild(d);
});

let cur=0, notesOn=false;
const el = {
  chipL:document.getElementById('chipL'), chipR:document.getElementById('chipR'),
  count:document.getElementById('count'), bar:document.getElementById('bar'),
  notes:document.getElementById('notes'), notesBody:document.getElementById('notesBody'),
  menu:document.getElementById('menu')
};

function show(i){
  i=Math.max(0,Math.min(DECK.length-1,i));
  document.querySelectorAll('.slide').forEach(s=>s.classList.remove('on'));
  document.getElementById('s'+i).classList.add('on');
  const s=DECK[i];
  el.chipL.textContent=s.h+' · '+s.c;
  el.chipR.textContent=s.t;
  el.count.textContent=(i+1)+' / '+DECK.length;
  el.bar.style.width=((i+1)/DECK.length*100)+'%';
  el.notesBody.textContent=s.n||'—';
  document.getElementById('stage').scrollTop=0;
  cur=i;
  try{location.hash='s'+i}catch(e){}
  if(document.getElementById('scamMsg')) armDrill();
}
function go(n){show(cur+n)}

/* ---------- controls ---------- */
document.getElementById('btnNext').onclick=()=>go(1);
document.getElementById('btnPrev').onclick=()=>go(-1);
document.getElementById('btnNotes').onclick=toggleNotes;
document.getElementById('btnMenu').onclick=toggleMenu;

function toggleNotes(){notesOn=!notesOn;el.notes.classList.toggle('on',notesOn)}
function toggleMenu(){el.menu.classList.toggle('on')}

document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){el.menu.classList.remove('on');return}
  if(el.menu.classList.contains('on'))return;
  if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' '){e.preventDefault();go(1)}
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(-1)}
  else if(e.key==='Home'){show(0)}
  else if(e.key==='End'){show(DECK.length-1)}
  else if(e.key==='n'||e.key==='N'){toggleNotes()}
  else if(e.key==='m'||e.key==='M'){toggleMenu()}
});

/* touch */
let tx=null;
document.addEventListener('touchstart',e=>{tx=e.changedTouches[0].clientX},{passive:true});
document.addEventListener('touchend',e=>{
  if(tx===null)return;
  const dx=e.changedTouches[0].clientX-tx;
  if(Math.abs(dx)>60) go(dx<0?1:-1);
  tx=null;
},{passive:true});

/* ---------- menu ---------- */
(function(){
  let html='', last='';
  DECK.forEach((s,i)=>{
    if(s.h!==last){html+='<h3>'+s.h+'</h3>';last=s.h}
    const title=(s.html.match(/<h1>([\s\S]*?)<\/h1>/)||s.html.match(/<h2>[\s\S]*?<\/span>([\s\S]*?)<\/h2>/)||[,s.c])[1]
      .replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim();
    html+='<a href="#s'+i+'" data-i="'+i+'">'+String(i+1).padStart(2,'0')+' &nbsp; '+title+'</a>';
  });
  el.menu.innerHTML=html;
  el.menu.addEventListener('click',e=>{
    const a=e.target.closest('a'); if(!a)return;
    e.preventDefault(); show(+a.dataset.i); el.menu.classList.remove('on');
  });
})();

/* ---------- scam drill ---------- */
function armDrill(){
  const box=document.getElementById('scamMsg');
  if(!box||box.dataset.armed)return;
  box.dataset.armed='1';
  const out=document.getElementById('drillCount');
  const flags=box.querySelectorAll('.flag');
  flags.forEach(f=>{
    f.setAttribute('tabindex','0');
    f.setAttribute('role','button');
    const hit=()=>{
      f.classList.add('hit');
      const n=box.querySelectorAll('.flag.hit').length;
      out.textContent = n<4 ? n+' of 4 found'
        : 'All 4 found — urgency, a fee threat, a fake address, and gift-card payment.';
    };
    f.addEventListener('click',hit);
    f.addEventListener('keydown',ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();hit()}});
  });
}

/* ---------- start ---------- */
const h=(location.hash.match(/^#s(\d+)$/)||[])[1];
show(h?+h:0);

</script>
